site_name: Harbormaster
site_description: A web control center for AWS ECS
repo_url: https://github.com/rcss-labs/harbormaster
repo_name: rcss-labs/harbormaster
edit_uri: edit/main/harbormaster-docs/docs/
copyright: Copyright &copy; 2026 RCSS Labs. Released under the MIT licence.

theme:
  name: material
  logo: assets/main_logo.png
  favicon: assets/main_logo.png
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

plugins:
  - search

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

nav:
  - Home: index.md
  - Getting started:
      - What is Harbormaster: getting-started/what-is-harbormaster.md
      - Concepts: getting-started/concepts.md
