<!--meta title="Change password" shell="none" h="760"-->
<div style="min-height:100vh;display:flex;flex-direction:column">
 <div class="row" style="justify-content:flex-end;padding:12px 16px">
  <span class="sm mut">Show state</span>
  <div class="seg" role="group" aria-label="Show state"><sc-for list="{{variants}}" as="o" hint-placeholder-count="2"><button type="button" aria-pressed="{{o.pressed}}" onClick="{{o.pick}}">{{o.label}}</button></sc-for></div>
 </div>
 <main style="flex:1;display:flex;align-items:center;justify-content:center;padding:24px 16px">
  <section class="panel" aria-label="Choose a new password" style="width:min(400px,100%)">
   <div class="stack" style="padding:24px;gap:16px">
    <div class="row" style="gap:10px;flex-wrap:nowrap">[[logo]]<div><div class="b" style="font-size:14px">Harbormaster</div><div class="sm mut">ECS control center</div></div></div>
    <div class="stack-s" style="gap:6px"><h1 style="font-size:18px;font-weight:600">Choose a new password</h1><p class="sm mut">{{sub}}</p></div>
    <div class="field"><label for="cp-current">Current password</label><input id="cp-current" type="password" class="input {{currentCls}}" autocomplete="current-password" value="{{current}}" onChange="{{setCurrent}}"><sc-if value="{{currentErrOn}}" hint-placeholder-val="{{false}}"><span class="ferr" role="alert">Current password is wrong.</span></sc-if></div>
    <div class="field"><label for="cp-new">New password</label><input id="cp-new" type="password" class="input" autocomplete="new-password" value="{{newPassword}}" onChange="{{setNewPassword}}"></div>
    <div class="field"><label for="cp-confirm">Confirm</label><input id="cp-confirm" type="password" class="input {{confirmCls}}" autocomplete="new-password" value="{{confirm}}" onChange="{{setConfirm}}"><sc-if value="{{confirmErrOn}}" hint-placeholder-val="{{false}}"><span class="ferr" role="alert">Passwords do not match.</span></sc-if></div>
    <a class="btn btn-p" href="Overview.dc.html" onClick="{{submit}}" style="width:100%;min-height:36px">Change password</a>
   </div>
  </section>
 </main>
</div>
