<!--meta title="My access" crumbs="My access" nav="" h="620"-->
<div class="ph"><div><h1>My access</h1><div class="sub">{{sub}}</div></div>
 <div class="row"><span class="sm mut">Show state</span><div class="seg" role="group" aria-label="Show state"><sc-for list="{{modes}}" as="o" hint-placeholder-count="2"><button type="button" aria-pressed="{{o.pressed}}" onClick="{{o.pick}}">{{o.label}}</button></sc-for></div></div>
</div>
<section class="panel" aria-label="Permissions by tag">
 <div class="panel-h"><span class="panel-t">Permissions by tag</span><span class="sm mut">{{who}}</span></div>
 <div class="tw"><table class="tbl" style="min-width:920px"><thead><tr><th>Tag</th><th>View</th><th>Logs</th><th>Operate</th><th>Deploy</th><th>Edit task definition</th><th>Terminal</th><th class="num">Services</th></tr></thead>
 <tbody><sc-for list="{{rows}}" as="r" hint-placeholder-count="3"><tr>
  <td><span class="{{r.tagCls}}">{{r.tag}}</span></td>
  <td><sc-if value="{{r.view}}" hint-placeholder-val="{{true}}"><span class="row c-ok" style="flex-wrap:nowrap;gap:4px">[[i:check]]Yes</span></sc-if><sc-if value="{{r.noView}}" hint-placeholder-val="{{false}}"><span class="row mut" style="flex-wrap:nowrap;gap:4px">[[i:x]]No</span></sc-if></td>
  <td><sc-if value="{{r.logs}}" hint-placeholder-val="{{true}}"><span class="row c-ok" style="flex-wrap:nowrap;gap:4px">[[i:check]]Yes</span></sc-if><sc-if value="{{r.noLogs}}" hint-placeholder-val="{{false}}"><span class="row mut" style="flex-wrap:nowrap;gap:4px">[[i:x]]No</span></sc-if></td>
  <td><sc-if value="{{r.operate}}" hint-placeholder-val="{{true}}"><span class="row c-ok" style="flex-wrap:nowrap;gap:4px">[[i:check]]Yes</span></sc-if><sc-if value="{{r.noOperate}}" hint-placeholder-val="{{false}}"><span class="row mut" style="flex-wrap:nowrap;gap:4px">[[i:x]]No</span></sc-if></td>
  <td><sc-if value="{{r.deploy}}" hint-placeholder-val="{{true}}"><span class="row c-ok" style="flex-wrap:nowrap;gap:4px">[[i:check]]Yes</span></sc-if><sc-if value="{{r.noDeploy}}" hint-placeholder-val="{{false}}"><span class="row mut" style="flex-wrap:nowrap;gap:4px">[[i:x]]No</span></sc-if></td>
  <td><sc-if value="{{r.edit}}" hint-placeholder-val="{{true}}"><span class="row c-ok" style="flex-wrap:nowrap;gap:4px">[[i:check]]Yes</span></sc-if><sc-if value="{{r.noEdit}}" hint-placeholder-val="{{false}}"><span class="row mut" style="flex-wrap:nowrap;gap:4px">[[i:x]]No</span></sc-if></td>
  <td><sc-if value="{{r.terminal}}" hint-placeholder-val="{{true}}"><span class="row c-ok" style="flex-wrap:nowrap;gap:4px">[[i:check]]Yes</span></sc-if><sc-if value="{{r.noTerminal}}" hint-placeholder-val="{{false}}"><span class="row mut" style="flex-wrap:nowrap;gap:4px">[[i:x]]No</span></sc-if></td>
  <td class="num mono">{{r.services}}</td>
 </tr></sc-for></tbody></table></div>
</section>
