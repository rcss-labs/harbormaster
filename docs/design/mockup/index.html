<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Harbormaster ECS mockup</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Layout: Stackstead's shell (sidebar + full-width content), harbour-blue accent so it reads as a sibling product. */
:root {
  color-scheme: light;
  --bg: #f2f5f8;
  --surface: #ffffff;
  --raised: #f6f8fa;
  --hover: #ecf1f5;
  --border: #dde3ea;
  --border-strong: #c6d0da;
  --text: #141a21;
  --muted: #5c6979;
  --accent: #0b6a8f;
  --accent-ink: #ffffff;
  --accent-soft: rgba(11, 106, 143, 0.11);
  --success: #047857;
  --warning: #9c4707;
  --danger: #b91c1c;
  --info: #5b3fc4;
  --success-soft: rgba(4, 120, 87, 0.12);
  --warning-soft: rgba(156, 71, 7, 0.12);
  --danger-soft: rgba(185, 28, 28, 0.11);
  --info-soft: rgba(91, 63, 196, 0.12);
  --muted-soft: rgba(92, 105, 121, 0.12);
  --series-1: #0b6a8f;
  --series-2: #e07a1f;
  --series-3: #7c3aed;
  --series-4: #0f9d77;
  --series-5: #d6336c;
  --series-6: #8a6d00;
  --term-bg: #0d1217;
  --term-text: #d7e3ec;
  --shadow: 0 1px 2px rgba(16, 24, 40, 0.06);
  --shadow-pop: 0 18px 50px rgba(16, 24, 40, 0.2);
  --overlay: rgba(16, 24, 40, 0.38);
  --sans: 'IBM Plex Sans', system-ui, sans-serif;
  --mono: 'Geist Mono', ui-monospace, Menlo, Consolas, monospace;
  --radius: 7px;
  --sidebar-w: 232px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #0e1216; --surface: #141a20; --raised: #1a2129; --hover: #1e2630;
    --border: #252d37; --border-strong: #38424f; --text: #e5eaf0; --muted: #8c97a7;
    --accent: #4cb4de; --accent-ink: #04202c; --accent-soft: rgba(76, 180, 222, 0.15);
    --success: #34d399; --warning: #fbbf24; --danger: #f87171; --info: #a78bfa;
    --success-soft: rgba(52, 211, 153, 0.15); --warning-soft: rgba(251, 191, 36, 0.15);
    --danger-soft: rgba(248, 113, 113, 0.15); --info-soft: rgba(167, 139, 250, 0.16);
    --muted-soft: rgba(140, 151, 167, 0.14); --series-1: #4cb4de; --series-2: #f59e4b; --series-3: #a78bfa; --series-4: #34d399; --series-5: #f472b6; --series-6: #e3b341;
    --shadow: 0 1px 0 rgba(0, 0, 0, 0.4); --shadow-pop: 0 18px 50px rgba(0, 0, 0, 0.55); --overlay: rgba(4, 7, 10, 0.6);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #0e1216; --surface: #141a20; --raised: #1a2129; --hover: #1e2630;
  --border: #252d37; --border-strong: #38424f; --text: #e5eaf0; --muted: #8c97a7;
  --accent: #4cb4de; --accent-ink: #04202c; --accent-soft: rgba(76, 180, 222, 0.15);
  --success: #34d399; --warning: #fbbf24; --danger: #f87171; --info: #a78bfa;
  --success-soft: rgba(52, 211, 153, 0.15); --warning-soft: rgba(251, 191, 36, 0.15);
  --danger-soft: rgba(248, 113, 113, 0.15); --info-soft: rgba(167, 139, 250, 0.16);
  --muted-soft: rgba(140, 151, 167, 0.14); --series-1: #4cb4de; --series-2: #f59e4b; --series-3: #a78bfa; --series-4: #34d399; --series-5: #f472b6; --series-6: #e3b341;
  --shadow: 0 1px 0 rgba(0, 0, 0, 0.4); --shadow-pop: 0 18px 50px rgba(0, 0, 0, 0.55); --overlay: rgba(4, 7, 10, 0.6);
}

*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--text); font: 13px/1.45 var(--sans); font-variant-numeric: tabular-nums; }
h1, h2, h3, p { margin: 0; }
h1 { font-size: 22px; line-height: 1.2; font-weight: 600; letter-spacing: -0.015em; text-wrap: balance; }
h2 { font-size: 14px; font-weight: 600; text-wrap: balance; }
h3 { font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; }
a { color: inherit; text-decoration: none; }
button, input, select, textarea { font: inherit; color: inherit; }
code, pre, .mono { font-family: var(--mono); font-size: 12px; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

.app { display: grid; grid-template-columns: var(--sidebar-w) minmax(0, 1fr); height: 100%; }
.sidebar { background: var(--surface); border-right: 1px solid var(--border); display: flex; flex-direction: column; min-height: 0; }
.brand { display: flex; align-items: center; gap: 10px; padding: 14px 16px; border-bottom: 1px solid var(--border); }
.brand-name { font-weight: 600; font-size: 15px; letter-spacing: -0.01em; }
.brand-sub { font-size: 11px; color: var(--muted); }
.nav { display: flex; flex-direction: column; gap: 2px; padding: 10px 8px; overflow: auto; }
.nav a { display: flex; align-items: center; gap: 10px; padding: 7px 10px; border-radius: var(--radius); color: var(--muted); font-weight: 500; }
.nav a:hover { background: var(--hover); color: var(--text); }
.nav a.active { background: var(--accent-soft); color: var(--accent); }
.nav .count { margin-left: auto; font-size: 11px; color: var(--muted); }
.nav .count.bad { color: var(--danger); font-weight: 600; }
.nav-section { padding: 12px 10px 4px; font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; }
.side-foot { margin-top: auto; border-top: 1px solid var(--border); padding: 12px 16px; display: grid; gap: 4px; font-size: 11.5px; color: var(--muted); }
.side-foot strong { color: var(--text); font-weight: 500; }

.main { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
.topbar { height: 52px; flex: none; display: flex; align-items: center; gap: 12px; padding: 0 20px; border-bottom: 1px solid var(--border); background: var(--surface); }
.crumbs { display: flex; align-items: center; gap: 6px; color: var(--muted); min-width: 0; overflow: hidden; white-space: nowrap; }
.crumbs a:hover { color: var(--text); }
.crumbs .sep { opacity: 0.5; }
.crumbs .here { color: var(--text); font-weight: 500; }
.top-tools { margin-left: auto; display: flex; align-items: center; gap: 8px; }
.search-wrap { position: relative; }
.search { width: 240px; height: 30px; padding: 0 10px; border: 1px solid var(--border-strong); border-radius: var(--radius); background: var(--raised); }
.search-results { position: absolute; right: 0; top: 36px; width: 340px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow-pop); z-index: 30; padding: 4px; display: grid; }
.search-results a { padding: 7px 10px; border-radius: 5px; display: flex; gap: 8px; align-items: baseline; }
.search-results a:hover, .search-results a.sel { background: var(--hover); }
.search-results .kind { font-size: 11px; color: var(--muted); width: 54px; flex: none; }
.content { flex: 1; overflow: auto; padding: 20px 24px 40px; display: flex; flex-direction: column; gap: 18px; min-height: 0; }

select.ctl, input.ctl, textarea.ctl { height: 30px; padding: 0 8px; border: 1px solid var(--border-strong); border-radius: var(--radius); background: var(--surface); }
textarea.ctl { height: auto; padding: 8px; }
.btn { height: 30px; padding: 0 12px; border-radius: var(--radius); border: 1px solid var(--border-strong); background: var(--surface); cursor: pointer; font-weight: 500; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.btn:hover { background: var(--hover); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.07); }
.btn.danger { color: var(--danger); }
.btn.danger.solid { background: var(--danger); border-color: var(--danger); color: #fff; }
.btn.sm { height: 26px; padding: 0 9px; font-size: 12px; }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }
.icon-btn { width: 30px; height: 30px; display: inline-grid; place-items: center; border-radius: var(--radius); border: 1px solid var(--border-strong); background: var(--surface); cursor: pointer; }

.page-head { display: flex; align-items: flex-start; gap: 16px; flex-wrap: wrap; }
.page-head .titles { display: grid; gap: 6px; min-width: 0; }
.page-head .meta { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; color: var(--muted); font-size: 12px; }
.page-head .actions { margin-left: auto; display: flex; gap: 8px; flex-wrap: wrap; }
.title-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }

.card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; box-shadow: var(--shadow); min-width: 0; }
.card-head { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-bottom: 1px solid var(--border); }
.card-head .right { margin-left: auto; display: flex; gap: 8px; align-items: center; }
.card-body { padding: 14px; }
.grid { display: grid; gap: 14px; }
.g2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.g3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.g4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.g-wide { grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); }
@media (max-width: 1100px) { .g4 { grid-template-columns: repeat(2, minmax(0, 1fr)); } .g3, .g-wide { grid-template-columns: minmax(0, 1fr); } }
@media (max-width: 700px) { .g2, .g4 { grid-template-columns: minmax(0, 1fr); } }

.tile { padding: 12px 14px; display: grid; gap: 4px; }
.tile .k { font-size: 12px; color: var(--muted); }
.tile .v { font-size: 22px; font-weight: 600; letter-spacing: -0.02em; display: flex; align-items: baseline; gap: 6px; }
.tile .v small { font-size: 13px; font-weight: 400; color: var(--muted); }
.tile .sub { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 8px; justify-content: space-between; }

.pill { display: inline-flex; align-items: center; gap: 6px; height: 22px; padding: 0 8px; border-radius: 999px; font-size: 11.5px; font-weight: 500; white-space: nowrap; }
.pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.pill.ok { color: var(--success); background: var(--success-soft); }
.pill.warn { color: var(--warning); background: var(--warning-soft); }
.pill.bad { color: var(--danger); background: var(--danger-soft); }
.pill.info { color: var(--info); background: var(--info-soft); }
.pill.mute { color: var(--muted); background: var(--muted-soft); }
.pill.info::before { animation: pulse 1.2s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: 0.25; } }

.label { display: inline-flex; align-items: center; gap: 4px; height: 20px; padding: 0 7px; border-radius: 4px; font-size: 11px; font-weight: 600; letter-spacing: 0.02em; border: 1px solid var(--border-strong); color: var(--muted); background: var(--raised); }
.label.c-red { color: var(--danger); border-color: color-mix(in srgb, var(--danger) 40%, transparent); background: var(--danger-soft); }
.label.c-amber { color: var(--warning); border-color: color-mix(in srgb, var(--warning) 40%, transparent); background: var(--warning-soft); }
.label.c-blue { color: var(--accent); border-color: color-mix(in srgb, var(--accent) 40%, transparent); background: var(--accent-soft); }
.label.c-violet { color: var(--info); border-color: color-mix(in srgb, var(--info) 40%, transparent); background: var(--info-soft); }
.label.c-green { color: var(--success); border-color: color-mix(in srgb, var(--success) 40%, transparent); background: var(--success-soft); }
.label.inh { border-style: dashed; }
button.label { cursor: pointer; }
button.label:hover { border-color: var(--accent); }

table.t { width: 100%; border-collapse: collapse; }
.t th { text-align: left; font-weight: 500; color: var(--muted); font-size: 12px; padding: 8px 12px; border-bottom: 1px solid var(--border); white-space: nowrap; }
.t td { padding: 9px 12px; border-bottom: 1px solid var(--border); vertical-align: middle; }
.t tr:last-child td { border-bottom: 0; }
.t tbody tr.link { cursor: pointer; }
.t tbody tr.link:hover td { background: var(--hover); }
.t .num { text-align: right; }
.t .name { font-weight: 500; }
.table-wrap { overflow-x: auto; }
.muted { color: var(--muted); }
.small { font-size: 12px; }
.stripe { border-left: 3px solid transparent; }
.stripe.bad { border-left-color: var(--danger); }
.stripe.warn { border-left-color: var(--warning); }
.stripe.info { border-left-color: var(--info); }

.kv { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 7px 16px; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }

.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--border); overflow-x: auto; }
.tabs a { padding: 9px 12px; color: var(--muted); font-weight: 500; border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap; }
.tabs a:hover { color: var(--text); }
.tabs a.active { color: var(--text); border-bottom-color: var(--accent); }
.tabs .badge { font-size: 10.5px; margin-left: 4px; color: var(--muted); }

.bar { height: 6px; border-radius: 3px; background: var(--muted-soft); overflow: hidden; display: flex; }
.bar span { display: block; height: 100%; background: var(--accent); transition: width 0.4s; }
.bar span.old { background: var(--border-strong); }

.alert-row { display: flex; gap: 12px; align-items: flex-start; padding: 10px 14px; border-bottom: 1px solid var(--border); }
.alert-row:last-child { border-bottom: 0; }
.alert-row .what { display: grid; gap: 2px; min-width: 0; }
.alert-row .when { margin-left: auto; color: var(--muted); font-size: 12px; white-space: nowrap; }
.feed { display: grid; }
.feed-row { display: grid; grid-template-columns: 74px 92px minmax(0, 1fr); gap: 10px; padding: 7px 14px; border-bottom: 1px solid var(--border); font-size: 12.5px; }
.feed-row:last-child { border-bottom: 0; }
.src { font-size: 11px; font-weight: 600; }
.src.q { color: var(--accent); }
.src.e { color: var(--muted); }

.chart { width: 100%; height: auto; display: block; }
.chart text { fill: var(--muted); font-family: var(--mono); font-size: 10px; }
.chart .grid-line { stroke: var(--border); stroke-width: 1; }
.legend { display: flex; gap: 14px; font-size: 12px; color: var(--muted); }
.legend i { display: inline-block; width: 10px; height: 3px; border-radius: 2px; margin-right: 6px; vertical-align: middle; }
.seg { display: inline-flex; border: 1px solid var(--border-strong); border-radius: var(--radius); overflow: hidden; }
.seg button { border: 0; background: var(--surface); padding: 0 10px; height: 28px; cursor: pointer; font-size: 12px; }
.seg button + button { border-left: 1px solid var(--border-strong); }
.seg button.on { background: var(--accent-soft); color: var(--accent); font-weight: 600; }

.editor { width: 100%; min-height: 520px; resize: vertical; font-family: var(--mono); font-size: 12px; line-height: 1.55; padding: 12px; border: 1px solid var(--border-strong); border-radius: var(--radius); background: var(--raised); tab-size: 2; white-space: pre; }
.editor.invalid { border-color: var(--danger); }
.form-grid { display: grid; gap: 12px; }
.field { display: grid; gap: 5px; }
.field > span { font-size: 12px; color: var(--muted); font-weight: 500; }
.env-row { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.3fr) 26px; gap: 6px; }
.env-row input { min-width: 0; }
.hint { font-size: 12px; color: var(--muted); }
.err { font-size: 12px; color: var(--danger); }
.banner { display: flex; gap: 10px; align-items: flex-start; padding: 10px 14px; border-radius: var(--radius); border: 1px solid; font-size: 12.5px; }
.banner.info { color: var(--text); background: var(--accent-soft); border-color: color-mix(in srgb, var(--accent) 35%, transparent); }
.banner.warn { color: var(--text); background: var(--warning-soft); border-color: color-mix(in srgb, var(--warning) 35%, transparent); }
.banner.bad { color: var(--text); background: var(--danger-soft); border-color: color-mix(in srgb, var(--danger) 35%, transparent); }

.diff { font-family: var(--mono); font-size: 12px; line-height: 1.5; border: 1px solid var(--border); border-radius: var(--radius); max-height: 380px; overflow: auto; background: var(--raised); }
.diff div { padding: 0 10px; white-space: pre; }
.diff .add { background: var(--success-soft); color: var(--success); }
.diff .del { background: var(--danger-soft); color: var(--danger); }
.diff .gap { color: var(--muted); background: var(--muted-soft); }

.logs { background: var(--term-bg); color: var(--term-text); font-family: var(--mono); font-size: 12px; line-height: 1.55; border-radius: 8px; height: 520px; overflow: auto; padding: 10px 0; }
.logs .ln { display: grid; grid-template-columns: 96px 130px minmax(0, 1fr); gap: 10px; padding: 0 12px; white-space: pre-wrap; overflow-wrap: anywhere; }
.logs .ln:hover { background: rgba(255, 255, 255, 0.04); }
.logs .ts { color: #6f8495; }
.logs .ct { color: #7cc4e4; }
.logs .lvl-error { color: #ff8a8a; }
.logs .lvl-warn { color: #f5c76b; }
.toolbar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }

.term { background: var(--term-bg); color: var(--term-text); font-family: var(--mono); font-size: 12.5px; line-height: 1.5; border-radius: 8px; height: 480px; overflow: auto; padding: 12px 14px; cursor: text; }
.term .out { white-space: pre-wrap; overflow-wrap: anywhere; }
.term .sys { color: #7cc4e4; }
.term .line { display: flex; gap: 8px; }
.term input { flex: 1; background: transparent; border: 0; outline: none; color: var(--term-text); font: inherit; padding: 0; }
.term .prompt { color: #8fdc9f; white-space: nowrap; }

.net-cards { display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); }
.net-card { padding: 14px; display: grid; gap: 10px; cursor: pointer; transition: border-color 0.15s; }
.net-card:hover { border-color: var(--accent); }
.net-card.off { cursor: default; opacity: 0.6; }
.net-card.off:hover { border-color: var(--border); }
.net-card .big { font-size: 16px; font-weight: 600; }
.stats { display: flex; gap: 16px; flex-wrap: wrap; font-size: 12px; color: var(--muted); }
.stats b { color: var(--text); font-weight: 600; font-size: 14px; margin-right: 3px; }

.vpc-frame { border: 2px dashed var(--border-strong); border-radius: 14px; padding: 14px; display: grid; gap: 14px; background: color-mix(in srgb, var(--accent-soft) 35%, transparent); }
.vpc-edge { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.edge-chip { display: inline-flex; gap: 6px; align-items: center; padding: 4px 10px; border-radius: 999px; background: var(--surface); border: 1px solid var(--border-strong); font-size: 12px; }
.az-row { display: grid; gap: 10px; }
.az-title { font-size: 12px; font-weight: 600; color: var(--muted); }
.subnets { display: flex; gap: 14px; flex-wrap: wrap; align-items: flex-start; }
.subnet { flex: 1 1 340px; min-width: 300px; background: var(--surface); border: 1px solid var(--border-strong); border-radius: 10px; padding: 12px; display: grid; gap: 10px; }
.subnet.public { border-top: 3px solid var(--success); }
.subnet.private { border-top: 3px solid var(--accent); }
.subnet-head { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.blk-cluster { border: 1px solid var(--border-strong); border-radius: 9px; padding: 8px; display: grid; gap: 8px; background: var(--raised); }
.blk-cluster > .h { display: flex; gap: 8px; align-items: center; font-weight: 600; font-size: 12.5px; }
.blk-service { border: 1px solid var(--border); border-radius: 7px; padding: 7px; background: var(--surface); display: grid; gap: 6px; }
.blk-service > .h { display: flex; gap: 6px; align-items: center; font-size: 12px; font-weight: 500; }
.blk-service > .h a:hover { color: var(--accent); }
.task-chips { display: flex; flex-wrap: wrap; gap: 5px; }
.task-chip { font-family: var(--mono); font-size: 11px; padding: 3px 7px; border-radius: 5px; background: var(--accent-soft); color: var(--text); border: 1px solid transparent; cursor: pointer; display: inline-flex; gap: 6px; }
.task-chip:hover { border-color: var(--accent); }
.task-chip .ip { color: var(--muted); }
.task-chip.unhealthy { background: var(--warning-soft); }
.empty { padding: 26px; text-align: center; color: var(--muted); }

.dlg-backdrop { position: fixed; inset: 0; background: var(--overlay); display: grid; place-items: center; z-index: 50; padding: 16px; }
.dlg { width: min(640px, 100%); max-height: calc(100% - 32px); overflow: auto; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; box-shadow: var(--shadow-pop); display: grid; }
.dlg.wide { width: min(920px, 100%); }
.dlg-head { padding: 16px 18px 0; display: grid; gap: 4px; }
.dlg-body { padding: 14px 18px; display: grid; gap: 12px; }
.dlg-foot { padding: 12px 18px 16px; display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }
.radio-list { display: grid; gap: 6px; }
.radio-list label { display: flex; gap: 10px; align-items: center; padding: 8px 10px; border: 1px solid var(--border); border-radius: var(--radius); cursor: pointer; }
.radio-list label:hover { background: var(--hover); }

.toasts { position: fixed; right: 18px; bottom: 18px; display: grid; gap: 8px; z-index: 60; }

  const ml = marks.map(m => `<span class="mkl" style="left:${m.at * 100}%">${esc(m.label)}</span>`).join('');
  return `<div class="pchart" style="height:${h}px"><div class="py">${ys}</div><div class="pplot">${svg}${ml}</div><div></div><div class="px">${xLabels.map(l => `<span>${esc(l)}</span>`).join('')}</div></div>`;

const fmtNum = v => v >= 1000 ? (v / 1000).toFixed(v >= 10000 ? 0 : 1) + 'k' : v >= 10 || v === 0 ? Math.round(v) : +v.toFixed(1);
const niceMax = v => { const p = Math.pow(10, Math.floor(Math.log10(Math.max(v, 1)))); return Math.ceil(v / p) * p; };
const sum = a => a.reduce((x, y) => x + y, 0);
const SERIES = ['var(--series-1)', 'var(--series-2)', 'var(--series-3)', 'var(--series-4)', 'var(--series-5)', 'var(--series-6)'];
const STATUS_COLOR = { ok: 'var(--success)', warn: 'var(--warning)', bad: 'var(--danger)', info: 'var(--info)', mute: 'var(--border-strong)' };
const legend = items => `<div class="legend" style="flex-wrap:wrap">${items.map(i => `<span><i style="background:${i.color}"></i>${esc(i.name)}</span>`).join('')}</div>`;
function donut(segs, { label = '', sub = '' } = {}) {
  const total = sum(segs.map(s => s.v)) || 1, r = 52, C = 2 * Math.PI * r;
  let off = 0;
  const arcs = segs.filter(s => s.v > 0).map(s => {
    const len = (s.v / total) * C;
    const el = `<circle r="${r}" cx="66" cy="66" fill="none" stroke="${s.color}" stroke-width="14" stroke-dasharray="${Math.max(0, len - 2)} ${C - len + 2}" stroke-dashoffset="${-off}" transform="rotate(-90 66 66)"><title>${esc(s.name)}: ${s.v}</title></circle>`;
    off += len;
    return el;
  }).join('');
  return `<div class="donut-wrap"><svg width="88" height="88" viewBox="0 0 132 132" role="img"><circle r="${r}" cx="66" cy="66" fill="none" stroke="var(--muted-soft)" stroke-width="14"/>${arcs}<text x="66" y="68" text-anchor="middle" class="donut-v">${esc(label)}</text><text x="66" y="86" text-anchor="middle" class="donut-s">${esc(sub)}</text></svg>
    <div class="donut-legend">${segs.map(s => `<div><i style="background:${s.color}"></i><span>${esc(s.name)}</span><b>${s.v}</b></div>`).join('')}</div></div>`;
}
// items: [{ name, href?, sub?, v | parts:[{v,color}], ghost?, label? }]
function hbars(items, { max, unit = '' } = {}) {
  const m = max || Math.max(1, ...items.map(i => Math.max(i.ghost || 0, i.parts ? sum(i.parts.map(p => p.v)) : i.v)));
  if (!items.length) return '<div class="muted small">Nothing to show.</div>';
  return `<div class="hbars">${items.map(i => `<div class="hbar"><div class="hbar-l">${i.href ? `<a href="${i.href}">${esc(i.name)}</a>` : `<span>${esc(i.name)}</span>`}${i.sub ? `<span class="muted small">${esc(i.sub)}</span>` : ''}</div>
    <div class="hbar-track">${(i.parts || [{ v: i.v, color: i.color || 'var(--accent)' }]).filter(p => p.v > 0).map(p => `<span style="width:${(p.v / m) * 100}%;background:${p.color}"></span>`).join('')}${i.ghost ? `<em style="left:calc(${(i.ghost / m) * 100}% - 1px)" title="desired"></em>` : ''}</div>
    <div class="hbar-v">${i.label ?? fmtNum(i.v) + unit}</div></div>`).join('')}</div>`;

// cols: [{ parts:[{v,color}], title }]; xLabels: [[index, text]]
function vbars(cols, { h = 100, xLabels = [], unit = '' } = {}) {
  const W = 1000, H = 100, top = niceMax(Math.max(2, ...cols.map(c => sum(c.parts.map(p => p.v))))), bw = W / cols.length;
  let svg = `<svg class="plot" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-hidden="true">`;
  for (let i = 0; i <= 2; i++) svg += `<line x1="0" x2="${W}" y1="${H - (i / 2) * H}" y2="${H - (i / 2) * H}" class="gl"/>`;
  cols.forEach((c, i) => {
    let y = H;
    c.parts.forEach(p => {
      const ph = (p.v / top) * H;
      if (ph <= 0) return;
      y -= ph;
      svg += `<rect x="${(i * bw + bw * 0.18).toFixed(1)}" y="${y.toFixed(2)}" width="${(bw * 0.64).toFixed(1)}" height="${ph.toFixed(2)}" fill="${p.color}"><title>${esc(c.title || '')}</title></rect>`;
    });
  });
  svg += '</svg>';
  const ys = [0, 1, 2].map(i => `<span style="top:${100 - (i / 2) * 100}%">${fmtNum((top * i) / 2)}${unit}</span>`).join('');
  const xs = xLabels.map(([i, l]) => `<span style="position:absolute;left:${((i + 0.5) / cols.length) * 100}%;transform:translateX(-50%)">${esc(l)}</span>`).join('');
  return `<div class="pchart" style="height:${h}px"><div class="py">${ys}</div><div class="pplot">${svg}</div><div></div><div class="px" style="position:relative">${xs}</div></div>`;
}
const card = (title, body, right = '') => `<div class="card"><div class="card-head"><h2>${title}</h2>${right ? `<div class="right muted small">${right}</div>` : ''}</div><div class="card-body">${body}</div></div>`;
const XL24 = ['24 h ago', '18 h', '12 h', '6 h', 'now'];
const dayLabel = ts => new Date(ts).toLocaleDateString([], { month: 'short', day: 'numeric' });
function deployMarks(s, hours) {
  return s.deploys.filter(d => NOW - d.ts < hours * 3600e3 || d.ts > NOW).map(d => ({ at: Math.min(1, 1 - (Date.now() - d.ts) / (hours * 3600e3)), label: d.kind === 'restart' ? 'restart' : ':' + d.rev }));
}

}

function stopReason(t) {
  if (/OutOfMemory/.test(t.reason)) return 'Out of memory (exit 137)';

const REASON_COLOR = { 'Out of memory (exit 137)': 'var(--danger)', 'Failed load balancer health checks': 'var(--warning)', 'Stopped by a user': 'var(--series-3)', 'Scaled in': 'var(--series-4)', 'Replaced by a deployment': 'var(--border-strong)' };

/* ---------- shell ---------- */
function parseRoute() {
  const h = decodeURIComponent(location.hash.slice(1)) || 'overview';
  const p = h.split('-');
  if (p[0] === 'svc' && SERVICES[p[1]]) return { view: 'service', id: p[1], tab: p[2] || 'overview' };
  if (p[0] === 'cl' && CLUSTERS[p[1]]) return { view: 'cluster', id: p[1] };
  if (p[0] === 'net') return { view: 'net', acct: p[1], region: p[2], vpc: p[3] };
  if (['overview', 'clusters', 'tasks', 'storage', 'accounts', 'users', 'tags', 'audit', 'access'].includes(h)) return { view: h };
  return { view: 'overview' };
}
function renderNav(r) {
  const nAlerts = alerts().filter(a => a.k === 'bad').length;

  const items = [
    ['overview', 'Overview', nAlerts ? `<span class="count bad">${nAlerts}</span>` : ''],
    ['clusters', 'Clusters', `<span class="count">${visibleClusters().length}</span>`],
    ['tasks', 'Tasks', `<span class="count">${nRun}</span>`],
    ['net', 'Networks', ''],

  if (me().admin) html += `<div class="nav-section">Admin</div>${link('users', 'Users and permissions', Object.keys(USERS).length)}${link('tags', 'Tags', TAGS.length)}${link('accounts', 'AWS accounts', Object.keys(ACCOUNTS).length)}${link('audit', 'Audit log')}`;
  else html += `<div class="nav-section">Account</div>${link('access', 'My access')}`;

    <div class="toolbar" style="gap:6px"><select class="ctl sm" id="view-as" aria-label="Switch user (mockup)" title="Mockup: switch user without signing in">${Object.keys(USERS).map(n => `<option ${n === currentUser ? 'selected' : ''}>${n}</option>`).join('')}</select><button class="btn sm" data-action="sign-out">Sign out</button></div>`;

let route = parseRoute();

function rerenderIfShowing(sid) {

  const y = $('#content').scrollTop;

}

  const tasks = seenTasks().filter(t => inFilter(CLUSTERS[t.cluster]));

  const feed = svcs.flatMap(s => s.ops.map(o => ({ ...o, s }))).sort((a, b) => b.ts - a.ts).slice(0, 10);

  const stops = Array.from({ length: 24 }, (_, h) => {
    const ok = sum(svcs.map(s => s.stopHist[h].ok)), err = sum(svcs.map(s => s.stopHist[h].err));
    return { parts: [{ v: ok, color: 'var(--border-strong)' }, { v: err, color: 'var(--danger)' }], title: `${24 - h} h ago: ${ok} normal, ${err} with an error` };
  });
  const days = Array.from({ length: 14 }, (_, i) => NOW - (13 - i) * 86400e3);

const avg = a => a.length ? a.reduce((x, y) => x + y, 0) / a.length : 0;

function vCluster(r) {

  const marks = svcs.flatMap(s => s.deploys.filter(d => NOW - d.ts < 24 * 3600e3 && d.kind === 'deploy').map(d => ({ at: 1 - (Date.now() - d.ts) / (24 * 3600e3), label: s.name.split('-')[0] + ':' + d.rev })));
  const svcCards = svcs.map(s => {

      ${c.insights ? `<div class="mini2"><div><div class="mini-k">CPU <b>${pct(last(s.cpuSeries))}</b></div>${spark(s.cpuSeries, 'var(--series-1)', { w: 200, h: 28, fluid: true })}</div><div><div class="mini-k">Memory <b>${pct(last(s.memSeries))}</b></div>${spark(s.memSeries, 'var(--series-2)', { w: 200, h: 28, fluid: true })}</div></div>` : ''}
      <div><div class="mini-k">Tasks <b>${running(s.id).length} / ${s.desired}</b></div>${taskSlots(s)}</div>

/* ---------- service ---------- */
const TABS = [['overview', 'Overview'], ['metrics', 'Metrics'], ['config', 'Task definition'], ['tasks', 'Tasks'], ['scaling', 'Scaling'], ['logs', 'Logs'], ['terminal', 'Terminal'], ['ops', 'Operations log']];
function vService(r) {
  const s = SERVICES[r.id], c = CLUSTERS[s.cluster];

  const st = status(s);
  const pendingRev = latestRev(s) > s.rev && s.state !== 'deploying' ? latestRev(s) : null;
  const tabs = TABS.map(([k, t]) => {
    let badge = '';
    if (k === 'tasks') badge = `<span class="badge">${running(s.id).length}</span>`;
    if (k === 'config' && pendingRev) badge = `<span class="badge">:${pendingRev} ready</span>`;

    return `<a href="#svc-${s.id}-${k}" class="${r.tab === k ? 'active' : ''} ${locked ? 'locked' : ''}" ${locked ? `title="You need ${ACTION_NAME[need]} on ${esc(serviceTag(s))}"` : ''}>${t}${locked ? ' ⊘' : ''}${badge}</a>`;
  }).join('');
  const body = { overview: sOverview, metrics: sMetrics, config: sConfig, tasks: sTasks, scaling: sScaling, logs: sLogs, terminal: sTerminal, ops: sOps }[r.tab] || sOverview;
  return `
  <div class="page-head"><div class="titles"><div class="title-row"><h1>${esc(s.name)}</h1>${labelHtml(s, 'service')}${pill(st)}</div>
    <div class="meta"><a href="#cl-${c.id}" style="color:var(--accent)">${esc(c.name)}</a><span>${esc(ACCOUNTS[c.acct].name)}</span><span>${REGIONS[c.region]}</span><span class="mono">${esc(s.name)}:${s.rev}</span><span>Fargate</span></div></div>
    <div class="actions">
      <button class="btn" data-action="restart" data-id="${s.id}" ${s.state === 'deploying' ? 'disabled' : gate('operate', s)}>Restart (new deployment)</button>
      <a class="btn" href="#svc-${s.id}-scaling">Desired count: ${s.desired}</a>
      <a class="btn" href="https://${REGIONS[c.region]}.console.aws.amazon.com/ecs/v2/clusters/${esc(c.name)}/services/${esc(s.name)}" target="_blank" rel="noopener">AWS console ↗</a>
    </div></div>
  ${pendingRev ? `<div class="banner info"><span>Revision <strong>${esc(s.name)}:${pendingRev}</strong> is registered but not deployed. The service still runs :${s.rev}.</span><span style="margin-left:auto"><button class="btn sm primary" data-action="deploy-rev" data-id="${s.id}" data-rev="${pendingRev}" ${gate('deploy', s)}>Deploy :${pendingRev}</button></span></div>` : ''}
  <nav class="tabs">${tabs}</nav>

}

function deployTimeline(s) {
  const span = 14 * 86400e3, start = NOW - span;
  const evs = s.deploys.filter(d => d.ts >= start);
  const ticks = Array.from({ length: 8 }, (_, i) => start + (i / 7) * span);
  return `<div class="timeline"><div class="axis"></div>
    ${ticks.map(t => `<span class="tick" style="left:${((t - start) / span) * 100}%">${dayLabel(t)}</span>`).join('')}
    ${evs.map((d, i) => `<div class="ev ${i % 2 ? 'alt' : ''}" style="left:${Math.min(100, ((d.ts - start) / span) * 100)}%" title="${new Date(d.ts).toLocaleString()}"><span style="${d.ok ? '' : 'color:var(--danger)'}">${d.kind === 'restart' ? 'restart' : ':' + d.rev}${d.ok ? '' : ' failed'}</span><i style="background:${!d.ok ? 'var(--danger)' : d.kind === 'restart' ? 'var(--series-3)' : 'var(--accent)'}"></i></div>`).join('')}
  </div>`;
}
function sOverview(s, c) {
  const td = tdOf(s), vpc = VPCS[c.vpc];
  const run = running(s.id), subs = subnetsOf(s);
  const healthy = run.filter(t => t.health !== 'UNHEALTHY').length;
  const dep = s.deploy;
  const pending = s.state === 'deploying' ? Math.max(0, s.desired - dep.newRunning) : Math.max(0, s.desired - run.length);
  const deployCard = s.state === 'deploying'
    ? `<div class="grid" style="gap:10px"><div class="title-row">${pill({ k: 'info', t: 'Rollout in progress' })}<span class="mono">:${dep.from} → :${dep.to}</span><span class="muted small" style="margin-left:auto">started ${ago(dep.started)}</span></div>
       <div class="bar" style="height:10px"><span style="width:${(dep.newRunning / s.desired) * 100}%"></span><span class="old" style="width:${(dep.oldRunning / s.desired) * 100}%"></span></div>
       <div class="small muted">${dep.newRunning} new task${dep.newRunning === 1 ? '' : 's'} on :${dep.to} · ${dep.oldRunning} old on :${dep.from} · ${dep.failures ? `<span style="color:var(--danger)">${dep.failures} failed to start</span> · ` : ''}circuit breaker with rollback is on</div></div>`
    : `<div class="grid" style="gap:10px"><div class="title-row">${pill({ k: 'ok', t: 'Completed' })}<span class="mono">${esc(s.name)}:${s.rev}</span><span class="muted small" style="margin-left:auto">${ago(s.ops.find(o => /steady state/.test(o.text))?.ts || NOW)}</span></div>
       <div class="bar" style="height:10px"><span style="width:100%"></span></div><div class="small muted">Rolling update · min healthy 100% · max 200% · circuit breaker with rollback is on</div></div>`;
  const health = s.lb
    ? donut([{ name: 'Healthy targets', v: healthy, color: 'var(--success)' }, { name: 'Unhealthy targets', v: run.length - healthy, color: 'var(--warning)' }, { name: 'Missing tasks', v: pending, color: 'var(--danger)' }], { label: `${healthy}/${s.desired}`, sub: 'healthy' })
    : donut([{ name: 'Running', v: run.length, color: 'var(--success)' }, { name: 'Missing tasks', v: pending, color: 'var(--danger)' }], { label: `${run.length}/${s.desired}`, sub: 'running' });
  const errCols = s.lb ? s.err5xx.map((v, i) => ({ parts: [{ v, color: 'var(--danger)' }], title: `${24 - i} h ago: ${v} errors` })) : [];
  const rpmMax = s.lb ? niceMax(Math.max(...s.rpm)) : 0, p95Max = s.lb ? niceMax(Math.max(...s.p95)) : 0;
  return `
  <div class="grid g4">

    <div class="card tile"><div class="k">Deployed revision</div><div class="v mono" style="font-size:18px">:${s.rev}</div><div class="sub"><span class="mono">${esc(tdImageTag(td))}</span><a href="#svc-${s.id}-config" style="color:var(--accent)">View →</a></div></div>
    <div class="card tile"><div class="k">CPU (of ${s.cpu} units)</div><div class="v">${pct(last(s.cpuSeries))}</div>${spark(s.cpuSeries, 'var(--series-1)', { w: 300, h: 24, fluid: true })}</div>
    <div class="card tile"><div class="k">Memory (of ${s.mem} MiB)</div><div class="v">${pct(last(s.memSeries))}</div>${spark(s.memSeries, 'var(--series-2)', { w: 300, h: 24, fluid: true })}</div>
  </div>
  <div class="grid g-wide">
    ${card('CPU and memory, 24 h', legend([{ name: 'CPU', color: 'var(--series-1)' }, { name: 'Memory', color: 'var(--series-2)' }, { name: 'Deployment or restart', color: 'var(--info)' }]) + chart([{ values: s.cpuSeries, color: 'var(--series-1)' }, { values: s.memSeries, color: 'var(--series-2)' }], { xLabels: XL24, h: 160, marks: deployMarks(s, 24) }), `<a href="#svc-${s.id}-metrics" style="color:var(--accent)">All metrics →</a>`)}

    ${card('Response time p95, 24 h', chart([{ values: s.p95, color: 'var(--series-3)' }], { unit: ' ms', max: p95Max, xLabels: XL24, h: 110 }), `now ${Math.round(last(s.p95))} ms`)}
    ${card('HTTP 5xx per hour, 24 h', vbars(errCols, { h: 110, xLabels: [[0, '24 h ago'], [12, '12 h'], [23, 'now']] }), `${sum(s.err5xx)} today`)}
  </div>` : ''}
  <div class="grid g-wide">
    ${card('Running tasks', run.length ? `<div class="task-meters"><div class="task-meter muted small"><span>Task</span><span>Zone</span><span>CPU</span><span>Memory</span></div>${run.map(t => `<div class="task-meter"><a class="mono" href="#svc-${s.id}-tasks" title="${t.id}">${t.id.slice(0, 12)}</a><span class="muted">${t.az}${t.launch === 'FARGATE_SPOT' ? ' · spot' : ''}</span>
      <div class="meter"><div class="track"><span style="width:${t.cpu}%;background:var(--series-1)"></span></div><b>${pct(t.cpu)}</b></div>
      <div class="meter"><div class="track"><span style="width:${t.mem}%;background:${t.health === 'UNHEALTHY' ? 'var(--warning)' : 'var(--series-2)'}"></span></div><b>${pct(t.mem)}</b></div></div>`).join('')}</div>` : '<div class="empty">No running tasks.</div>', `${run.length} running`)}
    ${card('Running task count, 72 h', chart([{ values: s.taskHist, color: 'var(--accent)' }], { unit: '', max: Math.max(2, s.desired + 1), xLabels: ['72 h ago', '48 h', '24 h', 'now'], h: 110 }), `desired ${s.desired}`)}
  </div>
  ${card('Deployments, 14 days', legend([{ name: 'Deploy', color: 'var(--accent)' }, { name: 'Restart', color: 'var(--series-3)' }, { name: 'Failed, rolled back', color: 'var(--danger)' }]) + deployTimeline(s))}
  <div class="grid g2">
    <div class="card"><div class="card-head"><h2>Networking</h2><a class="right small" style="color:var(--accent)" href="#net-${c.acct}-${c.region}-${c.vpc}">Network tree →</a></div><div class="card-body"><dl class="kv">
      <dt>VPC</dt><dd>${esc(vpc.name)} <span class="mono muted">${vpc.vpcId}</span></dd>
      <dt>Subnets</dt><dd>${subs.map(nn => `${esc(nn.name)} <span class="muted">(${nn.az}, ${run.filter(t => t.subnet === nn.id).length} tasks)</span>`).join(', ')}</dd>
      <dt>Security groups</dt><dd class="mono">sg-${hexFor(s.id, 8)} (${esc(s.name)})${s.lb ? `, sg-${hexFor(s.id + 'x', 8)} (alb-ingress)` : ''}</dd>

      <dt>Service Connect</dt><dd>${s.port ? `<span class="mono">${esc(s.name)}.${esc(c.name.split('-')[0])}.local:${s.port}</span>` : '<span class="muted">Off</span>'}</dd>
    </dl></div></div>
    <div class="card"><div class="card-head"><h2>Task definition</h2></div><div class="card-body"><dl class="kv">
      <dt>Family</dt><dd class="mono">${esc(td.family)}:${s.rev}</dd>
      <dt>Size</dt><dd>${(td.cpu / 1024).toFixed(2)} vCPU · ${td.memory} MiB</dd>
      <dt>Containers</dt><dd>${td.containerDefinitions.map(cd => `<div class="mono small">${esc(cd.name)} · ${esc(cd.image.split('/').pop())}</div>`).join('')}</dd>
      <dt>Task role</dt><dd class="mono small">${esc(td.taskRoleArn.split('/').pop())}</dd>
      <dt>ECS Exec</dt><dd>${s.exec ? 'On' : '<span style="color:var(--warning)">Off</span>'}</dd>
      <dt>EFS</dt><dd>${s.efs ? `<a href="#storage" style="color:var(--accent)">${esc(EFS[s.efs[0]].name)}</a> → <span class="mono">${esc(s.efs[1])}</span>` : '<span class="muted">None</span>'}</dd>
    </dl></div></div>
  </div>
  <div class="card"><div class="card-head"><h2>Recent events</h2><a class="right small" style="color:var(--accent)" href="#svc-${s.id}-ops">Operations log →</a></div>
    <div class="feed">${s.ops.slice(0, 6).map(o => opRow(o)).join('')}</div></div>`;
}

function hexFor(key, n) { let h = 0; for (const ch of key) h = (h * 31 + ch.charCodeAt(0)) >>> 0; let out = ''; while (out.length < n) { h = (h * 1103515245 + 12345) >>> 0; out += ((h >>> 16) % 16).toString(16); } return out; }
const opRow = o => `<div class="feed-row"><span class="muted" title="${new Date(o.ts).toLocaleString()}">${ago(o.ts)}</span><span class="src ${o.src === 'ECS' ? 'e' : 'q'}">${o.src === 'ECS' ? 'ECS event' : esc(o.actor)}</span><span>${esc(o.text)}</span></div>`;

function sMetrics(s, c) {
  if (!c.insights) return `<div class="banner warn">Container Insights is off for ${esc(c.name)}, so per-service metrics are not available. Turn it on in the cluster's Terraform (<span class="mono">setting { name = "containerInsights" value = "enhanced" }</span>).</div>`;
  const ranges = { '1h': [12, ['1 h ago', '30 min', 'now']], '6h': [36, ['6 h ago', '3 h', 'now']], '24h': [72, ['24 h ago', '12 h', 'now']], '72h': [72, ['72 h ago', '36 h', 'now']] };
  const [n, xl] = ranges[S.metricsRange];
  const cut = a => a.slice(-n);
  const seg = Object.keys(ranges).map(k => `<button class="${S.metricsRange === k ? 'on' : ''}" data-action="range" data-v="${k}">${k}</button>`).join('');
  const netMax = Math.ceil(Math.max(...s.netIn, ...s.netOut) / 10) * 10;
  return `
  <div class="toolbar"><div class="seg" role="group" aria-label="Range">${seg}</div><span class="muted small">Container Insights via CloudWatch · 1-minute resolution, averaged across ${running(s.id).length} tasks</span></div>
  <div class="grid g2">
    <div class="card"><div class="card-head"><h2>CPU utilization</h2><span class="right muted small">now ${pct(last(s.cpuSeries))} of ${s.cpu} units</span></div><div class="card-body">${chart([{ values: cut(s.cpuSeries), color: 'var(--series-1)' }], { xLabels: xl, h: 150 })}</div></div>
    <div class="card"><div class="card-head"><h2>Memory utilization</h2><span class="right muted small">now ${pct(last(s.memSeries))} of ${s.mem} MiB</span></div><div class="card-body">${chart([{ values: cut(s.memSeries), color: 'var(--series-2)' }], { xLabels: xl, h: 150 })}</div></div>
    <div class="card"><div class="card-head"><h2>Network</h2><div class="right legend"><span><i style="background:var(--series-1)"></i>Received</span><span><i style="background:var(--series-2)"></i>Sent</span></div></div><div class="card-body">${chart([{ values: cut(s.netIn), color: 'var(--series-1)' }, { values: cut(s.netOut), color: 'var(--series-2)' }], { unit: ' KB/s', max: netMax, xLabels: xl, h: 150 })}</div></div>
    <div class="card"><div class="card-head"><h2>Running task count</h2><span class="right muted small">desired ${s.desired}</span></div><div class="card-body">${chart([{ values: cut(s.cpuSeries).map((v, i) => s.desired - (running(s.id).length < s.desired && i > n - 6 ? s.desired - running(s.id).length : 0)), color: 'var(--series-1)' }], { unit: '', max: Math.max(4, s.desired + 1), xLabels: xl, h: 150 })}</div></div>

    </div>

function sTasks(s) {

function taskRow(t, withService) {

    <td>${pill(st)}</td><td>${hl}</td><td class="mono">:${t.rev}</td><td><span class="mono">${t.ip}</span><div class="muted small">${esc(sub.name)} · ${t.az}</div></td><td class="small">${t.launch}</td>
    <td class="num">${t.status === 'RUNNING' ? pct(t.cpu) : '–'}</td><td class="num">${t.status === 'RUNNING' ? pct(t.mem) : '–'}</td>
    <td class="muted">${ago(t.started)}</td><td class="small ${t.exit ? '' : 'muted'}" style="max-width:280px">${t.reason ? esc(t.reason) + ` <span class="muted">· ${ago(t.stopped)}</span>` : ''}</td>

}

/* logs */
const LOG_LINES = {
  default: [['info', 'GET /health 200 2ms'], ['info', 'GET /api/v1/items 200 41ms'], ['info', 'POST /api/v1/items 201 88ms'], ['warn', 'slow query took 812ms: SELECT * FROM items WHERE owner_id = $1'], ['info', 'cache hit ratio 0.93'], ['error', 'upstream timeout after 5000ms (retrying 1/3)'], ['info', 'GET /api/v1/items/482 200 12ms']],
  'payments-api': [['info', 'POST /v1/charges 201 143ms provider=stripe'], ['info', 'GET /health 200 1ms'], ['info', 'webhook evt_1Q8 received type=charge.succeeded'], ['warn', 'idempotency key reused key=ik_7f3a'], ['info', 'POST /v1/refunds 200 98ms'], ['error', 'card_declined code=insufficient_funds charge=ch_3Q8x']],
  'image-resizer': [['info', 'starting image-resizer 0.4.2 on :8090'], ['info', 'loaded libvips 8.15.3'], ['info', 'resizing upload 9f2e.jpg 7952x5304 -> 2048w'], ['warn', 'memory usage 486MiB of 512MiB'], ['error', 'fatal: runtime: out of memory'], ['error', 'Container killed due to memory usage']],
  'jenkins-controller': [['info', 'Started pipeline platform/main #1842'], ['info', 'Provisioning EKS agent pod jnlp-k8s-7c2f'], ['info', 'Agent jnlp-k8s-7c2f is connected'], ['info', 'Finished: SUCCESS'], ['warn', 'Disk usage of JENKINS_HOME at 71%']],
};
function logsOf(s) {
  if (!S.logs[s.id]) {
    const lines = [];
    for (let i = 0; i < 70; i++) lines.push(mkLog(s, NOW - (70 - i) * 9000));
    S.logs[s.id] = { lines, follow: true, filter: '', container: 'all', stream: 'all' };
  }
  return S.logs[s.id];
}
function mkLog(s, ts) {
  const pool = LOG_LINES[s.name] || LOG_LINES.default;
  const [lvl, msg] = pool[Math.floor(rnd() * pool.length)];
  const run = running(s.id);
  const t = run.length ? run[Math.floor(rnd() * run.length)] : tasksOf(s.id)[0];
  const ct = s.sidecar && rnd() > 0.8 ? 'otel-collector' : s.name;
  return { ts, lvl, msg: ct === 'otel-collector' ? 'exporter: sent 512 spans to otlp endpoint' : msg, task: t ? t.id.slice(0, 8) : '–', ct };
}
const logLine = l => `<div class="ln"><span class="ts">${clock(l.ts)}</span><span class="ct">${esc(l.ct)}/${l.task}</span><span class="lvl-${l.lvl}">${esc(l.msg)}</span></div>`;
function filteredLogs(s) {
  const L = logsOf(s), f = L.filter.toLowerCase();
  return L.lines.filter(l => (L.container === 'all' || l.ct === L.container) && (L.stream === 'all' || (L.stream === 'errors' ? l.lvl !== 'info' : true)) && (!f || l.msg.toLowerCase().includes(f)));
}
function sLogs(s, c) {
  if (!can('logs', s)) return lockPanel('logs', s);
  const L = logsOf(s), td = tdOf(s);
  return `
  <div class="toolbar">
    <select class="ctl" data-log="container" aria-label="Container"><option value="all">All containers</option>${td.containerDefinitions.map(cd => `<option ${L.container === cd.name ? 'selected' : ''}>${esc(cd.name)}</option>`).join('')}</select>
    <select class="ctl" data-log="stream" aria-label="Level"><option value="all">All lines</option><option value="errors" ${L.stream === 'errors' ? 'selected' : ''}>Warnings and errors</option></select>
    <input class="ctl" data-log="filter" placeholder="Search logs" value="${esc(L.filter)}" style="width:220px" aria-label="Search logs">
    <button class="btn" data-action="log-follow">${L.follow ? 'Pause' : 'Follow'}</button>
    <span class="muted small" style="margin-left:auto">CloudWatch Logs · <span class="mono">/ecs/${esc(c.name)}/${esc(s.name)}</span> · ${L.follow ? 'live tail' : 'paused'}</span>
  </div>
  <div class="logs" id="log-box" role="log">${filteredLogs(s).map(logLine).join('')}</div>`;
}

/* terminal */
function sTerminal(s) {
  if (!can('terminal', s)) return lockPanel('terminal', s);
  const run = running(s.id), td = tdOf(s);
  if (!s.exec) return `<div class="banner warn"><div><strong>ECS Exec is off for ${esc(s.name)}.</strong> Turn on <span class="mono">enable_execute_command = true</span> on the service in Terraform and give the task role the <span class="mono">ssmmessages:*</span> permissions. New tasks then accept terminal sessions.</div></div>`;
  if (!run.length) return `<div class="empty card">No running tasks to connect to.</div>`;
  const T = S.terms[s.id] || (S.terms[s.id] = { task: run[0].id, container: td.containerDefinitions[0].name, shell: '/bin/sh', connected: false, out: [] });
  if (!run.find(t => t.id === T.task)) T.task = run[0].id;
  return `
  <div class="toolbar">
    <label class="field" style="grid-auto-flow:column;align-items:center"><span>Task</span><select class="ctl" data-term="task" ${T.connected ? 'disabled' : ''}>${run.map(t => `<option value="${t.id}" ${t.id === T.task ? 'selected' : ''}>${t.id.slice(0, 12)} · ${t.ip} · ${t.az}</option>`).join('')}</select></label>
    <label class="field" style="grid-auto-flow:column;align-items:center"><span>Container</span><select class="ctl" data-term="container" ${T.connected ? 'disabled' : ''}>${td.containerDefinitions.map(cd => `<option ${cd.name === T.container ? 'selected' : ''}>${esc(cd.name)}</option>`).join('')}</select></label>
    <label class="field" style="grid-auto-flow:column;align-items:center"><span>Command</span><select class="ctl" data-term="shell" ${T.connected ? 'disabled' : ''}>${['/bin/sh', '/bin/bash'].map(x => `<option ${x === T.shell ? 'selected' : ''}>${x}</option>`).join('')}</select></label>
    ${T.connected ? `<button class="btn danger" data-action="term-disconnect" data-id="${s.id}">Disconnect</button>` : `<button class="btn primary" data-action="term-connect" data-id="${s.id}">Connect</button>`}
    <span class="muted small" style="margin-left:auto">ECS Exec through SSM Session Manager · sessions are recorded in the operations log</span>
  </div>
  <div class="term" id="term">${T.out.map(o => `<div class="out ${o.sys ? 'sys' : ''}">${esc(o.t)}</div>`).join('')}${T.connected ? `<div class="line"><span class="prompt">${esc(T.container)}:/app $</span><input id="term-in" autocomplete="off" spellcheck="false" aria-label="Terminal input"></div>` : T.out.length ? '' : '<div class="out sys">Pick a task and a container, then Connect. Try ls, env, ps, df -h, hostname, cat /etc/os-release, exit.</div>'}</div>`;
}
function termRun(s, cmd) {
  const T = S.terms[s.id], t = TASKS[T.task], td = tdOf(s);
  const cd = td.containerDefinitions.find(x => x.name === T.container) || td.containerDefinitions[0];
  T.out.push({ t: `${T.container}:/app $ ${cmd}` });
  const c = cmd.trim().split(/\s+/)[0];
  const outs = {
    '': null,
    help: 'Commands in this mockup: ls, env, ps, df -h, hostname, whoami, pwd, cat /etc/os-release, uptime, exit',
    ls: s.port ? 'Dockerfile  config  dist  node_modules  package.json  server.js' : 'bin  config  jobs  worker.py  requirements.txt',
    pwd: '/app', whoami: 'app',
    hostname: `ip-${t.ip.replace(/\./g, '-')}.${REGIONS[CLUSTERS[s.cluster].region] === 'us-east-1' ? 'ec2.internal' : REGIONS[CLUSTERS[s.cluster].region] + '.compute.internal'}`,
    env: [...cd.environment.map(e => `${e.name}=${e.value}`), `ECS_CONTAINER_METADATA_URI_V4=http://169.254.170.2/v4/${t.id.slice(0, 12)}`, `AWS_REGION=${REGIONS[CLUSTERS[s.cluster].region]}`, 'HOME=/home/app'].join('\n'),
    ps: 'PID   USER     TIME  COMMAND\n    1 app       2:41 ' + (s.port ? 'node server.js' : 'python worker.py') + '\n   38 root      0:00 /managed-agents/execute-command/amazon-ssm-agent\n   61 app       0:00 ' + T.shell + '\n   67 app       0:00 ps',
    df: 'Filesystem                Size      Used Available Use% Mounted on\noverlay                  29.4G      9.8G     18.0G  35% /' + (s.efs ? `\n127.0.0.1:/                8.0E     ${EFS[s.efs[0]].sizeGiB}G      8.0E   0% ${s.efs[1]}` : '') + '\ntmpfs                    64.0M         0     64.0M   0% /dev',
    cat: cmd.includes('os-release') ? 'NAME="Alpine Linux"\nID=alpine\nVERSION_ID=3.20.3\nPRETTY_NAME="Alpine Linux v3.20"' : 'cat: missing file name',
    uptime: ` ${clock(Date.now())} up ${Math.round((Date.now() - t.started) / 3600e3)}:${String(Math.round(rnd() * 59)).padStart(2, '0')},  load average: 0.21, 0.18, 0.15`,
  };
  if (c === 'exit') {
    T.out.push({ t: `\nExiting session with sessionId: ecs-execute-command-${hexFor(t.id, 17)}.`, sys: true });
    T.connected = false;
    addOp(s, 'Harbormaster', me().name, `Closed terminal session on task ${t.id.slice(0, 12)} (${T.container}).`);
  } else if (c in outs) { if (outs[c] !== null) T.out.push({ t: outs[c] }); }
  else T.out.push({ t: `${T.shell.split('/').pop()}: ${c}: not found` });
}

function sOps(s) {
  const list = s.ops.filter(o => S.showEcsEvents || o.src !== 'ECS');

  <div class="card"><div class="feed">${list.map(opRow).join('') || '<div class="empty">No entries.</div>'}</div></div>`;
}

/* ---------- tasks (global) ---------- */
function vTasks() {
  crumbs([['Tasks']]);
  const scoped = seenTasks().filter(t => inFilter(CLUSTERS[t.cluster]));
  let all = scoped;
  const problems = t => (t.status === 'STOPPED' && t.exit && t.exit !== 0) || t.health === 'UNHEALTHY';
  const counts = { problems: all.filter(problems).length, running: all.filter(t => t.status === 'RUNNING').length, stopped: all.filter(t => t.status === 'STOPPED').length, all: all.length };
  if (S.tasksFilter === 'problems') all = all.filter(t => problems(t) || t.status === 'RUNNING');
  if (S.tasksFilter === 'running') all = all.filter(t => t.status === 'RUNNING');
  if (S.tasksFilter === 'stopped') all = all.filter(t => t.status === 'STOPPED');
  all.sort((a, b) => (problems(b) - problems(a)) || (a.status === b.status ? b.started - a.started : a.status === 'RUNNING' ? -1 : 1));
  const runT = scoped.filter(t => t.status === 'RUNNING');
  const azs = [...new Set(runT.map(t => t.az))].sort();
  const seg = [['problems', 'Problems first'], ['running', 'Running'], ['stopped', 'Stopped'], ['all', 'All']].map(([k, t]) => `<button class="${S.tasksFilter === k ? 'on' : ''}" data-action="tasks-filter" data-v="${k}">${t} <span class="muted">${counts[k]}</span></button>`).join('');
  return `
  <div class="page-head"><div class="titles"><h1>Tasks</h1><div class="meta">Every task in every cluster you can see. ECS keeps stopped tasks for about an hour; Harbormaster keeps them for 7 days.</div></div></div>
  <div class="grid g4">
    ${card('By status', donut([
      { name: 'Running, healthy', v: runT.filter(t => t.health !== 'UNHEALTHY').length, color: 'var(--success)' },
      { name: 'Running, unhealthy', v: runT.filter(t => t.health === 'UNHEALTHY').length, color: 'var(--warning)' },
      { name: 'Stopped, error', v: scoped.filter(t => t.status === 'STOPPED' && t.exit).length, color: 'var(--danger)' },
      { name: 'Stopped, normal', v: scoped.filter(t => t.status === 'STOPPED' && !t.exit).length, color: 'var(--border-strong)' },
    ], { label: String(runT.length), sub: 'running' }))}
    ${card('Running by availability zone', hbars(azs.map(az => ({ name: az, v: runT.filter(t => t.az === az).length, color: 'var(--accent)' }))))}
    ${card('Running by cluster', hbars(visibleClusters().map((c, i) => ({ name: c.name, href: '#cl-' + c.id, parts: [{ v: runT.filter(t => t.cluster === c.id && t.launch === 'FARGATE').length, color: 'var(--accent)' }, { v: runT.filter(t => t.cluster === c.id && t.launch === 'FARGATE_SPOT').length, color: 'var(--series-3)' }], label: String(runT.filter(t => t.cluster === c.id).length) }))) + `<div style="margin-top:10px">${legend([{ name: 'Fargate', color: 'var(--accent)' }, { name: 'Fargate Spot', color: 'var(--series-3)' }])}</div>`)}
    ${card('Why tasks stopped', reasonBars(scoped))}
  </div>
  <div class="toolbar"><div class="seg">${seg}</div></div>
  <div class="card"><div class="table-wrap"><table class="t">
    <thead><tr><th>Task</th><th>Service</th><th>Status</th><th>Health</th><th>Revision</th><th>Subnet / IP</th><th>Capacity</th><th class="num">CPU</th><th class="num">Memory</th><th>Started</th><th>Stopped reason</th><th></th></tr></thead>
    <tbody>${all.map(t => taskRow(t, true)).join('')}</tbody></table></div></div>`;
}

/* ---------- networks ---------- */
function vNet(r) {
  const acctIds = r.acct && ACCOUNTS[r.acct] ? [r.acct] : Object.keys(ACCOUNTS).filter(a => S.fAcct === 'all' || a === S.fAcct);
  if (r.vpc && VPCS[r.vpc]) return netVpc(VPCS[r.vpc]);
  if (r.acct && r.region && REGIONS[r.region]) return netRegion(r.acct, r.region);
  crumbs([['Networks']]);
  return `
  <div class="page-head"><div class="titles"><h1>Networks</h1><div class="meta">Account level: regions with active VPCs. A VPC is active when ECS tasks run in it.</div></div></div>
  ${acctIds.map(a => {
    const acc = ACCOUNTS[a];
    return `<div class="grid" style="gap:10px"><h2>${esc(acc.name)} <span class="muted mono small">${acc.number}</span></h2><div class="net-cards">${Object.keys(REGIONS).map(rg => {
      const vpcs = Object.values(VPCS).filter(v => v.acct === a && v.region === rg);
      const active = vpcs.filter(v => vpcTasks(v).length);
      const tasks = active.reduce((x, v) => x + vpcTasks(v).length, 0);
      const cls = Object.values(CLUSTERS).filter(c => c.acct === a && c.region === rg && canSeeCluster(c)).length;
      return active.length
        ? `<a class="card net-card" href="#net-${a}-${rg}"><div class="big">${REGIONS[rg]}</div><div class="stats"><span><b>${active.length}</b>active VPC${active.length === 1 ? '' : 's'}</span><span><b>${cls}</b>clusters</span><span><b>${tasks}</b>tasks</span></div>${vpcs.length > active.length ? `<div class="muted small">${vpcs.length - active.length} VPC without tasks hidden</div>` : ''}</a>`
        : `<div class="card net-card off"><div class="big">${REGIONS[rg]}</div><div class="muted small">No active VPCs</div></div>`;
    }).join('')}</div></div>`;
  }).join('')}`;
}
const vpcTasks = v => seenTasks().filter(t => t.status === 'RUNNING' && CLUSTERS[t.cluster].vpc === v.id);
function netRegion(a, rg) {
  crumbs([['Networks', '#net'], [ACCOUNTS[a].name, '#net-' + a], [REGIONS[rg]]]);
  const vpcs = Object.values(VPCS).filter(v => v.acct === a && v.region === rg).filter(v => vpcTasks(v).length);
  return `
  <div class="page-head"><div class="titles"><h1>${REGIONS[rg]}</h1><div class="meta">Active VPCs in ${esc(ACCOUNTS[a].name)}</div></div></div>
  <div class="net-cards">${vpcs.map(v => {
    const ts = vpcTasks(v), cls = [...new Set(ts.map(t => t.cluster))];
    return `<a class="card net-card" href="#net-${a}-${rg}-${v.id}"><div><div class="big">${esc(v.name)}</div><div class="mono muted small">${v.vpcId} · ${v.cidr}</div></div>
      <div class="stats"><span><b>${v.subnets.length}</b>subnets</span><span><b>${cls.length}</b>clusters</span><span><b>${ts.length}</b>tasks</span></div>
      <div class="muted small">${cls.map(c => esc(CLUSTERS[c].name)).join(', ')}</div></a>`;
  }).join('')}</div>`;
}
function netVpc(v) {
  crumbs([['Networks', '#net'], [ACCOUNTS[v.acct].name, '#net-' + v.acct], [REGIONS[v.region], `#net-${v.acct}-${v.region}`], [v.name]]);
  const ts = vpcTasks(v);
  const azs = [...new Set(v.subnets.map(n => n.az))].sort();
  const closed = k => S.treeClosed.has(k);
  const tog = (k, n) => n ? `<button class="tog" data-action="tree-toggle" data-key="${k}" aria-label="${closed(k) ? 'Expand' : 'Collapse'}" aria-expanded="${!closed(k)}">${closed(k) ? '+' : '−'}</button>` : '';
  const branch = (k, kids) => kids && !closed(k) ? `<ul>${kids}</ul>` : '';
  const subnetNode = n => {
    const here = ts.filter(t => t.subnet === n.id);
    const size = Math.pow(2, 32 - +n.cidr.split('/')[1]) - 5;
    const used = size - n.free + here.length;
    const byCluster = {};
    here.forEach(t => { ((byCluster[t.cluster] ||= {})[t.service] ||= []).push(t); });
    const kSub = 'sn:' + n.id;
    const clusters = Object.entries(byCluster).map(([cid, svcs]) => {
      const kCl = kSub + ':' + cid;
      const svcNodes = Object.entries(svcs).map(([sid, list]) => {
        const s = SERVICES[sid], kSv = kCl + ':' + sid;
        return `<li><div class="node service"><span class="kind">Service</span><div class="nh"><a href="#svc-${sid}-overview">${esc(s.name)}</a>${pill(status(s))}${tog(kSv, list.length)}</div><span class="ns">${list.length} task${list.length === 1 ? '' : 's'} here · :${s.rev}</span></div>
          ${branch(kSv, list.map(t => `<li><a class="node task ${t.health === 'UNHEALTHY' ? 'unhealthy' : ''}" href="#svc-${sid}-tasks" title="Task ${t.id}">${t.id.slice(0, 8)}<span class="ip">${t.ip}</span></a></li>`).join(''))}</li>`;
      }).join('');
      return `<li><div class="node cluster"><span class="kind">Cluster</span><div class="nh"><a href="#cl-${cid}">${esc(CLUSTERS[cid].name)}</a>${labelHtml(CLUSTERS[cid], 'cluster')}${tog(kCl, 1)}</div><span class="ns">${Object.keys(svcs).length} service${Object.keys(svcs).length === 1 ? '' : 's'} · ${Object.values(svcs).flat().length} tasks</span></div>${branch(kCl, svcNodes)}</li>`;
    }).join('');
    return `<li><div class="node subnet ${n.type.toLowerCase()}"><span class="kind">${n.type} subnet</span><div class="nh">${esc(n.name)}${tog(kSub, clusters ? 1 : 0)}</div><span class="ns mono">${n.subnetId} · ${n.cidr}</span><span class="ns">${used} of ${size} IPs used</span><div class="ipbar"><span style="width:${Math.max(2, (used / size) * 100)}%"></span></div></div>
      ${clusters ? branch(kSub, clusters) : '<ul><li><div class="node none">No running tasks</div></li></ul>'}</li>`;
  };
  const azNodes = azs.map(az => {
    const kAz = 'az:' + v.id + ':' + az, subs = v.subnets.filter(n => n.az === az);
    return `<li><div class="node az"><span class="kind">Availability zone</span><div class="nh">${az}${tog(kAz, 1)}</div><span class="ns">${subs.length} subnet${subs.length === 1 ? '' : 's'} · ${ts.filter(t => t.az === az).length} tasks</span></div>${branch(kAz, subs.map(subnetNode).join(''))}</li>`;
  }).join('');
  const kV = 'vpc:' + v.id;
  return `
  <div class="page-head"><div class="titles"><h1>${esc(v.name)}</h1><div class="meta"><span class="mono">${v.vpcId}</span><span>${v.cidr}</span><span>${v.subnets.length} subnets</span><span>${ts.length} running tasks</span><span>Internet gateway${v.nat ? ' · NAT gateway' : ''}</span></div></div>
    <div class="actions"><button class="btn" data-action="tree-expand" data-vpc="${v.id}">Expand all</button><button class="btn" data-action="tree-collapse" data-vpc="${v.id}">Collapse to services</button></div></div>
  <div class="card"><div class="card-head"><h2>Network tree</h2><span class="right muted small">VPC ▸ availability zone ▸ subnet ▸ cluster ▸ service ▸ task</span></div>
    <div class="card-body tree"><ul><li><div class="node vpc"><span class="kind">VPC</span><div class="nh">${esc(v.name)}${tog(kV, 1)}</div><span class="ns mono">${v.vpcId} · ${v.cidr}</span><span class="ns">${azs.length} zones · ${ts.length} tasks</span></div>${branch(kV, azNodes)}</li></ul></div></div>`;
}

/* ---------- storage ---------- */
function vStorage() {
  crumbs([['Storage']]);
  const list = visibleEfs();
  const users = efsUsers;
  const size = g => g < 1 ? (g * 1024).toFixed(0) + ' MiB' : g.toFixed(1) + ' GiB';
  const total = sum(list.map(f => f.sizeGiB));
  return `
  <div class="page-head"><div class="titles"><h1>Storage</h1><div class="meta">EFS file systems and the services that mount them. File systems are created by Terraform.</div></div></div>
  <div class="grid g-wide">
    ${card('Stored data by file system', hbars(list.map((f, i) => ({ name: f.name, sub: REGIONS[f.region], v: f.sizeGiB, color: users(f).length ? SERIES[i % SERIES.length] : 'var(--border-strong)', label: size(f.sizeGiB) }))), `${size(total)} in total`)}
    ${card('Mounted or not', donut([{ name: 'Mounted by a service', v: list.filter(f => users(f).length).length, color: 'var(--accent)' }, { name: 'Not mounted, still billed', v: list.filter(f => !users(f).length).length, color: 'var(--warning)' }], { label: String(list.length), sub: 'file systems' }))}
  </div>
  <div class="cards">${list.map((f, i) => {
    const us = users(f), conns = sum(us.map(s => running(s.id).length));
    const growth = ((f.sizeHist[29] - f.sizeHist[0]) / f.sizeHist[0]) * 100;
    return `<div class="card xcard" style="cursor:default">
      <div class="xcard-top"><div><div class="big">${esc(f.name)}</div><div class="muted small mono">${f.fsId} · ${REGIONS[f.region]} · ${esc(VPCS[f.vpc].name)}</div></div>${us.length ? pill({ k: 'ok', t: `${conns} client${conns === 1 ? '' : 's'}` }) : pill({ k: 'warn', t: 'Not mounted' })}</div>
      <div class="mini2"><div><div class="mini-k">Size, 30 days <b>${size(f.sizeGiB)}</b></div>${spark(f.sizeHist, SERIES[i % SERIES.length], { w: 200, h: 30, fluid: true })}<div class="muted small">${growth >= 0 ? '+' : ''}${growth.toFixed(0)}% in 30 days</div></div>
        <div><div class="mini-k">Throughput, 24 h <b>${fmtNum(last(f.thru))} MiB/s</b></div>${spark(f.thru, 'var(--series-4)', { w: 200, h: 30, fluid: true })}<div class="muted small">${esc(f.mode)}</div></div></div>
      <div><div class="mini-k">Access points</div>${f.aps.length ? f.aps.map(a => `<div class="mono small">${a.id} · ${esc(a.path)} · uid ${a.uid}</div>`).join('') : '<span class="muted small">None</span>'}</div>
      <div><div class="mini-k">Mounted by</div>${us.length ? us.map(s => `<div class="small"><a href="#svc-${s.id}-overview" style="color:var(--accent)">${esc(s.name)}</a> <span class="muted">(${esc(CLUSTERS[s.cluster].name)}) → <span class="mono">${esc(s.efs[1])}</span></span></div>`).join('') : '<span class="small" style="color:var(--warning)">No service mounts this file system.</span>'}</div>
    </div>`;
  }).join('')}</div>`;
}

/* ---------- users and permissions ---------- */
const presetOf = list => Object.entries(PRESETS).find(([, p]) => p.length === list.length && p.every(a => list.includes(a)))?.[0] || 'Custom';
function permCell(u, tag) {
  const p = permsFor(u, tag);
  return `<div class="pcell"><div class="ptogs">${ACTIONS.map(([k, n, l]) => `<button class="ptog ${p.includes(k) ? 'on' : ''}" data-action="perm-toggle" data-user="${u.name}" data-tag="${esc(tag)}" data-act="${k}" title="${n}" aria-pressed="${p.includes(k)}">${l}</button>`).join('')}</div>
    <select class="ctl sm" data-perm-preset data-user="${u.name}" data-tag="${esc(tag)}" aria-label="Preset for ${u.name} on ${esc(tag)}">${presetOf(p) === 'Custom' ? '<option selected>Custom</option>' : ''}${Object.keys(PRESETS).map(k => `<option ${presetOf(p) === k ? 'selected' : ''}>${k}</option>`).join('')}</select></div>`;
}

    <thead><tr><th>Username</th><th>Role</th><th>Can see</th><th>Last sign-in</th><th></th></tr></thead>

      <td>${u.admin ? '<span class="muted">Everything</span>' : TAGS.filter(t => permsFor(u, t.name).includes('view')).map(t => tagChip(t.name)).join(' ') || '<span class="muted">Nothing yet</span>'}</td>
      <td class="muted">${ago(u.lastSeen)}</td>
      <td class="num"><button class="btn sm" data-action="user-reset" data-user="${u.name}">Reset password</button> <button class="btn sm" data-action="user-admin" data-user="${u.name}">${u.admin ? 'Remove global admin' : 'Make global admin'}</button> <button class="btn sm danger" data-action="user-delete" data-user="${u.name}" ${u.name === currentUser ? 'disabled title="You cannot delete yourself"' : ''}>Delete</button></td></tr>`).join('')}</tbody></table></div></div>`;

  const opt = (cur, inheritName) => `${inheritName ? `<option value="" ${!cur ? 'selected' : ''}>Inherit (${esc(inheritName)})</option>` : ''}${TAGS.map(t => `<option ${cur === t.name ? 'selected' : ''}>${esc(t.name)}</option>`).join('')}`;
  return `
  <div class="page-head"><div class="titles"><h1>Tags</h1><div class="meta">Tags decide who can do what. They live only in Harbormaster; AWS tags are never read or written. An untagged cluster is Dev; an untagged service inherits its cluster's tag.</div></div>

  <div class="card"><div class="table-wrap"><table class="t">

    <tbody>${TAGS.map(t => {

        <td>${withAccess.map(u => `<span class="chip">${esc(u.name)} <span class="muted">${presetOf(permsFor(u, t.name))}</span></span>`).join(' ') || '<span class="muted">Global admins only</span>'}</td>
        <td class="num"><button class="btn sm" data-action="tag-rename" data-tag="${esc(t.name)}">Rename</button> <button class="btn sm danger" data-action="tag-delete" data-tag="${esc(t.name)}" ${t.builtin ? 'disabled title="Dev is the default tag"' : ''}>Delete</button></td></tr>`;
    }).join('')}</tbody></table></div></div>
  <div class="card"><div class="card-head"><h2>Assignments</h2><span class="right muted small">Dashed tags are inherited from the cluster</span></div><div class="table-wrap"><table class="t">
    <thead><tr><th>Cluster / service</th><th>Account · region</th><th>Tag</th><th>In effect</th></tr></thead>
    <tbody>${clAll.map(c => `<tr style="background:var(--raised)"><td class="name">${esc(c.name)}</td><td class="muted">${esc(ACCOUNTS[c.acct].name)} · ${REGIONS[c.region]}</td><td><select class="ctl sm" data-assign="cluster" data-id="${c.id}" aria-label="Tag for ${esc(c.name)}">${opt(clusterTag(c))}</select></td><td>${tagChip(clusterTag(c))}</td></tr>
      ${svcAll.filter(s => s.cluster === c.id).map(s => `<tr><td style="padding-left:28px">${esc(s.name)}</td><td></td><td><select class="ctl sm" data-assign="service" data-id="${s.id}" aria-label="Tag for ${esc(s.name)}">${opt(s.label, clusterTag(c))}</select></td><td>${tagChip(serviceTag(s), !s.label)}</td></tr>`).join('')}`).join('')}</tbody></table></div></div>`;
}

let dlgClose = null;
function dialog({ title, sub = '', body = '', actions = [], wide = false }) {

function toast(text, kind = '') {

function addOp(s, src, actor, text) { s.ops.unshift({ ts: Date.now(), src, actor, text }); }

/* line diff (LCS) */
function diffLines(a, b) {
  const A = a.split('\n'), B = b.split('\n'), n = A.length, m = B.length;
  const dp = Array.from({ length: n + 1 }, () => new Uint16Array(m + 1));
  for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--) dp[i][j] = A[i] === B[j] ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
  const out = []; let i = 0, j = 0;
  while (i < n || j < m) {
    if (i < n && j < m && A[i] === B[j]) { out.push([' ', A[i]]); i++; j++; }
    else if (j < m && (i >= n || dp[i][j + 1] >= dp[i + 1][j])) { out.push(['+', B[j]]); j++; }
    else { out.push(['-', A[i]]); i++; }
  }
  // keep 2 lines of context around changes
  const keep = out.map((_, k) => out.slice(Math.max(0, k - 2), k + 3).some(x => x[0] !== ' '));
  let html = '', gap = false;
  out.forEach(([t, l], k) => {
    if (!keep[k]) { if (!gap) html += '<div class="gap">⋯</div>'; gap = true; return; }
    gap = false;
    html += `<div class="${t === '+' ? 'add' : t === '-' ? 'del' : ''}">${t} ${esc(l)}</div>`;
  });
  return html;
}

/* ---------- simulated AWS behaviour ---------- */
function startDeploy(s, toRev, why) {
  if (s.timer) clearInterval(s.timer);
  const td = s.revisions.find(r => r.rev === toRev).td;
  const willFail = s.oomBelow && +td.memory < s.oomBelow;
  const fromRev = s.rev;
  s.state = 'deploying';
  s.deploy = { from: fromRev, to: toRev, started: Date.now(), newRunning: 0, oldRunning: running(s.id).length, failures: 0 };
  addOp(s, 'ECS', 'ECS', `(service ${s.name}) has started deployment ecs-svc/${hexFor(s.id + toRev + Date.now(), 19).replace(/[a-f]/g, '4')} for task definition ${s.name}:${toRev}.`);
  if (why) addOp(s, 'Harbormaster', me().name, why);
  let idx = 0;
  s.timer = setInterval(() => {
    const d = s.deploy;
    if (willFail) {
      const t = newTask(s, toRev, idx++, { status: 'STOPPED', started: Date.now() - 40e3, stoppedAt: Date.now(), reason: 'OutOfMemoryError: Container killed due to memory usage', exit: 137, health: 'UNKNOWN' });
      d.failures++;
      addOp(s, 'ECS', 'ECS', `(service ${s.name}) has stopped 1 running tasks: (task ${t.id.slice(0, 12)}). Reason: OutOfMemoryError.`);
      if (d.failures >= 3) {
        s.deploys.push({ ts: Date.now(), rev: toRev, ok: false, kind: 'deploy' });
        clearInterval(s.timer); s.timer = null; s.state = null; s.deploy = null;
        addOp(s, 'ECS', 'ECS', `(service ${s.name}) deployment failed: tasks failed to start. Circuit breaker rolled back to ${s.name}:${fromRev}.`);
        toast(`<strong>${esc(s.name)}</strong>: revision :${toRev} failed to start (OutOfMemoryError). Rolled back to :${fromRev}.`, 'bad');
      }
    } else if (d.newRunning < s.desired) {
      const t = newTask(s, toRev, idx++, { started: Date.now() });
      d.newRunning++;
      addOp(s, 'ECS', 'ECS', `(service ${s.name}) has started 1 tasks: (task ${t.id.slice(0, 12)}).`);
      const old = running(s.id).find(x => x.rev !== toRev || (x.rev === toRev && fromRev === toRev && x.started < d.started));
      if (old && d.oldRunning > 0) {
        old.status = 'STOPPED'; old.stopped = Date.now(); old.exit = 0; old.reason = `Scaling activity initiated by (deployment to ${s.name}:${toRev})`;
        d.oldRunning--;
        addOp(s, 'ECS', 'ECS', `(service ${s.name}) has stopped 1 running tasks: (task ${old.id.slice(0, 12)}).`);
      }
    } else {
      running(s.id).filter(x => x.started < d.started).forEach(old => { old.status = 'STOPPED'; old.stopped = Date.now(); old.exit = 0; old.reason = `Scaling activity initiated by (deployment to ${s.name}:${toRev})`; });
      clearInterval(s.timer); s.timer = null;
      s.rev = toRev; s.state = null; s.deploy = null;
      s.revisions.find(r => r.rev === toRev).deployedEver = true;
      if (s.oomBelow) { s.cpuSeries = s.cpuSeries.map((v, i) => i > 66 ? 20 + rnd() * 10 : v); s.memSeries = s.memSeries.map((v, i) => i > 66 ? 45 + rnd() * 10 : v); }
      addOp(s, 'ECS', 'ECS', `(service ${s.name}) has reached a steady state.`);
      toast(`<strong>${esc(s.name)}</strong> is running <span class="mono">:${toRev}</span> on all ${s.desired} tasks.`, 'ok');
      delete S.drafts[s.id];
      s.deploys.push({ ts: Date.now(), rev: toRev, ok: true, kind: fromRev === toRev ? 'restart' : 'deploy' });
    }
    rerenderIfShowing(s.id);
  }, 2400);
  rerenderIfShowing(s.id);
}
function reconcile(s) {
  const run = running(s.id);
  if (s.state === 'deploying') return;
  if (run.length < s.desired) {
    setTimeout(() => {
      if (s.oomBelow && +tdOf(s).memory < s.oomBelow) {
        newTask(s, s.rev, 0, { status: 'STOPPED', started: Date.now() - 50e3, stoppedAt: Date.now(), reason: 'OutOfMemoryError: Container killed due to memory usage', exit: 137, health: 'UNKNOWN' });
        addOp(s, 'ECS', 'ECS', `(service ${s.name}) has stopped 1 running tasks. Reason: OutOfMemoryError.`);
      } else {
        const t = newTask(s, s.rev, run.length);
        addOp(s, 'ECS', 'ECS', `(service ${s.name}) has started 1 tasks: (task ${t.id.slice(0, 12)}).`);
        if (running(s.id).length >= s.desired) addOp(s, 'ECS', 'ECS', `(service ${s.name}) has reached a steady state.`);
        reconcile(s);
      }
      rerenderIfShowing(s.id);
    }, 2200);
  } else if (run.length > s.desired) {
    setTimeout(() => {
      const t = running(s.id)[0];
      t.status = 'STOPPED'; t.stopped = Date.now(); t.exit = 0; t.reason = 'Scaling activity initiated by (desired count change)';
      addOp(s, 'ECS', 'ECS', `(service ${s.name}) has stopped 1 running tasks: (task ${t.id.slice(0, 12)}).`);
      if (running(s.id).length <= s.desired) addOp(s, 'ECS', 'ECS', `(service ${s.name}) has reached a steady state.`);
      reconcile(s);
      rerenderIfShowing(s.id);
    }, 1800);
  }
}

/* ---------- interactions ---------- */
function editDraft(s, fn) {
  const d = draftOf(s);
  let td;
  try { td = JSON.parse(d.text); } catch (e) { return; }

  d.text = JSON.stringify(td, null, 2);
  const ed = $('#td-editor');
  if (ed) ed.value = d.text;
  updateDraftStatus(s);
}
function updateDraftStatus(s) {
  const d = draftOf(s), st = $('#td-status'), ed = $('#td-editor');
  if (!st) return;
  let err = '';
  try { JSON.parse(d.text); } catch (e) { err = e.message; }
  const dirty = d.text !== JSON.stringify(tdOf(s), null, 2);
  st.className = err ? 'err' : 'hint';
  st.textContent = err ? err : dirty ? 'Unsaved changes' : 'No changes';
  ed.classList.toggle('invalid', !!err);
  document.querySelector('[data-action="draft-review"]').disabled = !dirty || !!err;
  document.querySelector('[data-action="draft-reset"]').disabled = !dirty;
}
function reviewDraft(s) {
  const d = draftOf(s);

  const stale = d.base !== s.rev;
  dialog({
    wide: true,

    sub: `Changes against the deployed revision :${s.rev}.`,
    body: `${stale ? `<div class="banner warn">The service moved from :${d.base} to :${s.rev} while you were editing. Check the diff before saving.</div>` : ''}<div class="diff">${diffLines(before, d.text)}</div>`,
    actions: [
      { label: 'Keep editing' },
      { label: `Register revision :${newRev}`, kind: 'primary', fn: () => {
        s.revisions.push({ rev: newRev, td: next, at: Date.now(), by: me().name + ' (Harbormaster)', deployedEver: false });
        addOp(s, 'Harbormaster', me().name, `Registered task definition ${s.name}:${newRev} (image ${tdImageTag(next)}, ${next.cpu} CPU / ${next.memory} MiB).`);
        S.drafts[s.id] = { text: JSON.stringify(next, null, 2), base: s.rev };
        setTimeout(() => askDeploy(s, newRev), 0);
      } },
    ],
  });
}
function askDeploy(s, rev, fromPrompt = true) {

      ${serviceTag(s) === 'Prod' ? '<div class="banner warn">This is a Prod service.</div>' : ''}`,

function editLabel(kind, id) {
