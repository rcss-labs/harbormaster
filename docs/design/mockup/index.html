/* ---------- permission and tag interactions ---------- */
function setPerms(u, tag, list, why) {
  const before = permsFor(u, tag);
  const next = list.length && !list.includes('view') ? ['view', ...list] : list;
  u.perms[tag] = ACTIONS.map(a => a[0]).filter(a => next.includes(a));
  const added = u.perms[tag].filter(a => !before.includes(a)), removed = before.filter(a => !u.perms[tag].includes(a));
  if (added.length) addAudit(`Gave ${u.name} ${added.map(a => ACTION_NAME[a]).join(', ')} on ${tag}${why ? ' (' + why + ')' : ''}.`);
  if (removed.length) addAudit(`Removed ${removed.map(a => ACTION_NAME[a]).join(', ')} on ${tag} from ${u.name}${why ? ' (' + why + ')' : ''}.`);
}
function tagDialog(existing) {
  const t = existing ? TAGS.find(x => x.name === existing) : null;
  dialog({
    title: t ? `Rename tag ${esc(t.name)}` : 'Create tag',
    sub: t ? 'Clusters, services and permissions keep pointing at it.' : 'New tags start with no users. Only global admins can see resources with it until you give permissions.',
    body: `<label class="field"><span>Name</span><input class="ctl" id="tag-name" value="${t ? esc(t.name) : ''}" placeholder="QA"></label>
      <div class="field"><span>Color</span><div class="toolbar">${TAG_COLORS.map(c => `<label class="toolbar" style="gap:5px"><input type="radio" name="tag-color" value="${c}" ${(t ? t.color : 'blue') === c ? 'checked' : ''}><span class="label c-${c}">${c}</span></label>`).join('')}</div></div>
      <div class="err" id="tag-err"></div>`,
    actions: [{ label: 'Cancel' }, { label: t ? 'Save' : 'Create tag', kind: 'primary', fn: root => {
      const name = root.querySelector('#tag-name').value.trim(), color = root.querySelector('input[name="tag-color"]:checked').value;
      const clash = TAGS.find(x => x.name.toLowerCase() === name.toLowerCase() && x !== t);
      if (!/^[A-Za-z][A-Za-z0-9 _-]{0,23}$/.test(name) || clash) { root.querySelector('#tag-err').textContent = clash ? `A tag called ${name} already exists.` : 'Use 1–24 letters, digits, spaces, hyphens or underscores, starting with a letter.'; return false; }
      if (t) {
        const old = t.name;
        t.name = name; t.color = color;
        Object.values(CLUSTERS).forEach(c => { if (c.label === old) c.label = name; });
        Object.values(SERVICES).forEach(s => { if (s.label === old) s.label = name; });
        Object.values(USERS).forEach(u => { if (u.perms[old]) { u.perms[name] = u.perms[old]; delete u.perms[old]; } });
        if (old !== name) addAudit(`Renamed tag ${old} to ${name}.`);
      } else { TAGS.push({ name, color }); addAudit(`Created tag ${name}.`); }
      toast(t ? `Tag saved.` : `Created tag <strong>${esc(name)}</strong>. Assign it on this page.`);
      render();
    } }],
  });
}
function adminAction(a, el) {
  const u = el.dataset.user ? USERS[el.dataset.user] : null;
  if (a === 'perm-toggle') {
    const tag = el.dataset.tag, act = el.dataset.act, cur = permsFor(u, tag);
    if (cur.includes(act)) setPerms(u, tag, act === 'view' ? [] : cur.filter(x => x !== act));
    else setPerms(u, tag, [...cur, act]);
    render();
  }
  if (a === 'add-user') {
    dialog({ title: 'Add user', sub: 'They sign in with this username and password. Give permissions in the matrix afterwards.',
      body: `<label class="field"><span>Username</span><input class="ctl" id="nu-name" placeholder="alex" autocomplete="off"></label>
        <label class="field"><span>Temporary password</span><input class="ctl mono" id="nu-pass" value="${hex(4)}-${hex(4)}-${hex(4)}" readonly></label>
        <label class="toolbar" style="gap:6px"><input type="checkbox" id="nu-admin"> Global admin (can do everything)</label>
        <p class="hint">They are asked to choose a new password at first sign-in.</p><div class="err" id="nu-err"></div>`,
      actions: [{ label: 'Cancel' }, { label: 'Add user', kind: 'primary', fn: root => {

        if (!/^[a-z][a-z0-9._-]{1,31}$/.test(name) || USERS[name]) { root.querySelector('#nu-err').textContent = USERS[name] ? `${name} already exists.` : 'Use 2–32 lowercase letters, digits, dots, hyphens or underscores.'; return false; }
        USERS[name] = { name, admin, lastSeen: 0, perms: {} };
        addAudit(`Created user ${name}${admin ? ' as global admin' : ''}.`);
        toast(`Added <strong>${esc(name)}</strong>.`); render();
      } }] });
  }
  if (a === 'user-reset') { addAudit(`Reset the password of ${u.name}.`); toast(`New temporary password for ${esc(u.name)}: <span class="mono">${hex(4)}-${hex(4)}-${hex(4)}</span>`); render(); }
  if (a === 'user-admin') {
    const admins = Object.values(USERS).filter(x => x.admin).length;
    if (u.admin && admins === 1) { toast('Harbormaster needs at least one global admin.', 'bad'); return; }
    dialog({ title: u.admin ? `Remove global admin from ${esc(u.name)}?` : `Make ${esc(u.name)} a global admin?`, sub: u.admin ? 'They keep only the per-tag permissions in the matrix.' : 'Global admins can do everything on every tag, and manage users, tags and AWS accounts.',
      actions: [{ label: 'Cancel' }, { label: u.admin ? 'Remove global admin' : 'Make global admin', kind: 'primary', fn: () => { u.admin = !u.admin; addAudit(`${u.admin ? 'Made' : 'Removed'} ${u.name} ${u.admin ? 'a global admin' : 'as global admin'}.`); render(); } }] });
  }
  if (a === 'user-delete') {
    dialog({ title: `Delete ${esc(u.name)}?`, sub: 'Their sessions end now. Their entries in operations and audit logs stay.',
      actions: [{ label: 'Cancel' }, { label: 'Delete user', kind: 'danger solid', fn: () => {
        if (u.admin && Object.values(USERS).filter(x => x.admin).length === 1) { toast('Harbormaster needs at least one global admin.', 'bad'); return; }
        delete USERS[u.name]; addAudit(`Deleted user ${u.name}.`); render();
      } }] });
  }
  if (a === 'add-tag') tagDialog(null);
  if (a === 'tag-rename') tagDialog(el.dataset.tag);
  if (a === 'tag-delete') {
    const name = el.dataset.tag;
    const cl = Object.values(CLUSTERS).filter(c => c.label === name), sv = Object.values(SERVICES).filter(s => s.label === name);
    const us = Object.values(USERS).filter(x => x.perms[name] && x.perms[name].length);
    dialog({ title: `Delete tag ${esc(name)}?`, sub: 'This changes who can see and do what.',
      body: `<ul class="small" style="margin:0;padding-left:18px;display:grid;gap:4px"><li>${cl.length} cluster${cl.length === 1 ? '' : 's'} become Dev.</li><li>${sv.length} service${sv.length === 1 ? '' : 's'} go back to inheriting their cluster's tag.</li><li>${us.length} user${us.length === 1 ? '' : 's'} lose the permissions they had on ${esc(name)}${us.length ? ': ' + us.map(x => esc(x.name)).join(', ') : ''}.</li></ul>`,
      actions: [{ label: 'Cancel' }, { label: 'Delete tag', kind: 'danger solid', fn: () => {
        cl.forEach(c => { c.label = null; }); sv.forEach(s => { s.label = null; });
        us.forEach(x => delete x.perms[name]);
        TAGS.splice(TAGS.findIndex(t => t.name === name), 1);
        addAudit(`Deleted tag ${name}.`); render();
      } }] });
  }
  if (a === 'sign-out') { addAudit('Signed out.'); showLogin(); }
}
function assignTag(kind, id, value) {

  const before = kind === 'cluster' ? clusterTag(x) : serviceTag(x);
  x.label = value || null;
  const after = kind === 'cluster' ? clusterTag(x) : serviceTag(x);
  addAudit(`Tagged ${kind} ${x.name} as ${value || 'inherit (' + after + ')'} (was ${before}).`);
  (kind === 'cluster' ? Object.values(SERVICES).filter(s => s.cluster === x.id) : [x]).forEach(s => addOp(s, 'Harbormaster', me().name, `Changed tag of ${kind} ${x.name} from ${before} to ${after}.`));
  toast(`${esc(x.name)} is now ${tagChip(after, kind === 'service' && !value)}`);
  render();
}

  if (act) {
    const a = act.dataset.action, r = parseRoute(), s = r.id ? SERVICES[r.id] : null;
    if (a === 'edit-label') { e.preventDefault(); e.stopPropagation(); editLabel(act.dataset.kind, act.dataset.id); return; }
    if (a === 'range') { S.metricsRange = act.dataset.v; render(); }
    if (['perm-toggle', 'add-user', 'user-reset', 'user-admin', 'user-delete', 'add-tag', 'tag-rename', 'tag-delete', 'sign-out'].includes(a)) { adminAction(a, act); return; }
    if (a === 'tasks-filter') { S.tasksFilter = act.dataset.v; render(); }
    if (a === 'list-view') { S.listView = act.dataset.v; render(); }
    if (a === 'tree-toggle') { const k = act.dataset.key; S.treeClosed.has(k) ? S.treeClosed.delete(k) : S.treeClosed.add(k); render(); }
    if (a === 'tree-expand') { S.treeClosed.clear(); render(); }
    if (a === 'tree-collapse') {
      S.treeClosed.clear();
      const v = VPCS[act.dataset.vpc];
      vpcTasks(v).forEach(t => S.treeClosed.add(`sn:${t.subnet}:${t.cluster}:${t.service}`));
      render();
    }
    if (a === 'restart') {
      const sv = SERVICES[act.dataset.id];
      dialog({ title: `Restart ${esc(sv.name)}?`, sub: `Starts a new deployment of :${sv.rev}. Each task is replaced, new ones first.`, actions: [{ label: 'Cancel' }, { label: 'Restart', kind: 'primary', fn: () => startDeploy(sv, sv.rev, `Restarted service (force new deployment) on revision ${sv.rev}.`) }] });
    }
    if (a === 'deploy-rev') askDeploy(SERVICES[act.dataset.id], +act.dataset.rev, false);
    if (a === 'draft-reset') { delete S.drafts[s.id]; render(); }
    if (a === 'draft-review') reviewDraft(s);
    if (a === 'env-add') { editDraft(s, td => td.containerDefinitions[0].environment.push({ name: 'NEW_VAR', value: '' })); render(); }
    if (a === 'env-del') { editDraft(s, td => td.containerDefinitions[0].environment.splice(+act.dataset.i, 1)); render(); }
    if (a === 'dc-step') { const i = $('#dc-input'); i.value = Math.max(0, +i.value + +act.dataset.d); }
    if (a === 'dc-apply') {
      const sv = SERVICES[act.dataset.id], n = Math.max(0, Math.min(50, +$('#dc-input').value || 0));
      if (n === sv.desired) { toast('Desired count is already ' + n + '.'); return; }
      const sc = sv.scaling, out = sc && (n < sc.min || n > sc.max);
      dialog({ title: `Set ${esc(sv.name)} to ${n} task${n === 1 ? '' : 's'}?`, sub: `Now ${sv.desired}. ${n === 0 ? 'Every task stops. The service and its definition stay.' : ''}`,
        body: out ? `<div class="banner warn">Auto scaling keeps this service between ${sc.min} and ${sc.max}. It will move ${n} back into that range.</div>` : '',
        actions: [{ label: 'Cancel' }, { label: 'Update desired count', kind: 'primary', fn: () => { const prev = sv.desired; sv.desired = n; addOp(sv, 'Harbormaster', me().name, `Changed desired count from ${prev} to ${n}.`); reconcile(sv); render(); } }] });
    }
    if (a === 'stop-task') {
      const t = TASKS[act.dataset.id], sv = SERVICES[t.service];
      dialog({ title: `Stop task ${t.id.slice(0, 12)}?`, sub: `${esc(sv.name)} will start a replacement to keep ${sv.desired} running.`, actions: [{ label: 'Cancel' }, { label: 'Stop task', kind: 'danger solid', fn: () => {
        t.status = 'STOPPED'; t.stopped = Date.now(); t.exit = 0; t.reason = `Task stopped by ${me().name} via Harbormaster`;
        addOp(sv, 'Harbormaster', me().name, `Stopped task ${t.id.slice(0, 12)}.`);
        reconcile(sv); render();
      } }] });
    }
    if (a === 'exec-task') {
      const t = TASKS[act.dataset.id], sv = SERVICES[t.service];
      const T = S.terms[sv.id] || (S.terms[sv.id] = { task: t.id, container: tdOf(sv).containerDefinitions[0].name, shell: '/bin/sh', connected: false, out: [] });
      if (!T.connected) T.task = t.id;
      location.hash = `svc-${sv.id}-terminal`;
    }
    if (a === 'term-connect') {
      const T = S.terms[s.id], t = TASKS[T.task];
      T.connected = true;
      T.out.push({ t: `$ aws ecs execute-command --cluster ${CLUSTERS[s.cluster].name} --task ${t.id} --container ${T.container} --interactive --command "${T.shell}"\n\nStarting session with SessionId: ecs-execute-command-${hexFor(t.id, 17)}`, sys: true });
      addOp(s, 'Harbormaster', me().name, `Opened terminal session on task ${t.id.slice(0, 12)} (${T.container}, ${T.shell}).`);
      render();
    }
    if (a === 'term-disconnect') { const T = S.terms[s.id]; termRun(s, 'exit'); T.connected = false; render(); }
    if (a === 'log-follow') { const L = logsOf(s); L.follow = !L.follow; render(); }
    if (a === 'add-account') {
      dialog({ title: 'Connect an AWS account', sub: 'Harbormaster assumes this role from its own task role.',
        body: `<label class="field"><span>Display name</span><input class="ctl" id="acc-name" placeholder="production"></label>
          <label class="field"><span>Role ARN</span><input class="ctl mono" id="acc-role" placeholder="arn:aws:iam::123456789012:role/harbormaster-access"></label>
          <label class="field"><span>External ID</span><input class="ctl mono" id="acc-ext" value="qs-${hex(12)}" readonly></label>
          <div class="field"><span>Regions to scan</span><div class="toolbar">${Object.values(REGIONS).map(r => `<label class="toolbar" style="gap:5px"><input type="checkbox" checked> ${r}</label>`).join('')}</div></div>
          <p class="hint">The role needs read access to ECS, EC2 (VPCs and subnets), EFS, CloudWatch and Logs, plus <span class="mono">ecs:RegisterTaskDefinition</span>, <span class="mono">ecs:UpdateService</span>, <span class="mono">ecs:StopTask</span>, <span class="mono">ecs:ExecuteCommand</span> and <span class="mono">iam:PassRole</span> for task roles.</p>`,
        actions: [{ label: 'Cancel' }, { label: 'Test and connect', kind: 'primary', fn: () => { toast('This is a mockup: no account was connected.'); } }] });
    }
    return;
  }
  if (go && !e.target.closest('a, button')) location.hash = go.dataset.go.slice(1);
});
document.addEventListener('change', e => {
  const r = parseRoute(), s = r.id ? SERVICES[r.id] : null, el = e.target;
  if (el.id === 'f-acct') { S.fAcct = el.value; render(); }
  if (el.id === 'f-region') { S.fRegion = el.value; render(); }
  if (el.id === 'view-as') { currentUser = el.value; toast(`Now signed in as <strong>${esc(el.value)}</strong> (mockup switch).`); render(); return; }
  if ('permPreset' in el.dataset) { setPerms(USERS[el.dataset.user], el.dataset.tag, PRESETS[el.value] || permsFor(USERS[el.dataset.user], el.dataset.tag), el.value !== 'Custom' ? 'preset ' + el.value : ''); render(); return; }
  if (el.dataset.assign) { assignTag(el.dataset.assign, el.dataset.id, el.value); return; }
  if (el.dataset.form === 'tag') editDraft(s, td => { const c = td.containerDefinitions[0]; c.image = c.image.replace(/:[^:]+$/, ':' + el.value); });
  if (el.dataset.form === 'cpu') { editDraft(s, td => { td.cpu = el.value; }); render(); }
  if (el.dataset.form === 'memory') { editDraft(s, td => { td.memory = el.value; }); render(); }
  if (el.dataset.form === 'env-k' || el.dataset.form === 'env-v') editDraft(s, td => { td.containerDefinitions[0].environment[+el.dataset.i][el.dataset.form === 'env-k' ? 'name' : 'value'] = el.value; });
  if (el.id === 'td-editor') render();
  if (el.dataset.log) { logsOf(s)[el.dataset.log] = el.value; render(); }
  if (el.dataset.term) { S.terms[s.id][el.dataset.term] = el.value; }
  if (el.id === 'ecs-ev') { S.showEcsEvents = el.checked; render(); }
});
document.addEventListener('input', e => {
  const r = parseRoute(), s = r.id ? SERVICES[r.id] : null;
  if (e.target.id === 'td-editor') { draftOf(s).text = e.target.value; updateDraftStatus(s); }
  if (e.target.dataset.log === 'filter') { logsOf(s).filter = e.target.value; const box = $('#log-box'); box.innerHTML = filteredLogs(s).map(logLine).join(''); }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && dlgClose) { dlgClose(); return; }
  if (e.target.id === 'term-in' && e.key === 'Enter') {
    const s = SERVICES[parseRoute().id];
    termRun(s, e.target.value);
    render();
  }
  if (e.target.id === 'td-editor' && e.key === 'Tab') {
    e.preventDefault();
    const t = e.target, p = t.selectionStart;
    t.value = t.value.slice(0, p) + '  ' + t.value.slice(t.selectionEnd);
    t.selectionStart = t.selectionEnd = p + 2;
    t.dispatchEvent(new Event('input', { bubbles: true }));
  }
});
function afterRender() {
  const lb = $('#log-box'); if (lb) lb.scrollTop = lb.scrollHeight;
  const term = $('#term'); if (term) { term.scrollTop = term.scrollHeight; const i = $('#term-in'); if (i) i.focus(); term.addEventListener('click', () => { const x = $('#term-in'); if (x) x.focus(); }); }
}

/* search */
const search = $('#search'), results = $('#search-results');
search.addEventListener('input', () => {
  const q = search.value.trim().toLowerCase();
  if (!q) { results.hidden = true; return; }
  const hits = [
    ...Object.values(CLUSTERS).filter(c => canSeeCluster(c) && c.name.includes(q)).map(c => ['Cluster', c.name, '#cl-' + c.id, REGIONS[c.region]]),
    ...Object.values(SERVICES).filter(s => canView(s) && s.name.includes(q)).map(s => ['Service', s.name, `#svc-${s.id}-overview`, CLUSTERS[s.cluster].name]),
    ...seenTasks().filter(t => t.status === 'RUNNING' && (t.id.startsWith(q) || t.ip.startsWith(q))).map(t => ['Task', t.id.slice(0, 12), `#svc-${t.service}-tasks`, SERVICES[t.service].name + ' · ' + t.ip]),
  ].slice(0, 8);
  results.innerHTML = hits.length ? hits.map((h, i) => `<a href="${h[2]}" class="${i === 0 ? 'sel' : ''}"><span class="kind">${h[0]}</span><span>${esc(h[1])}</span><span class="muted small" style="margin-left:auto">${esc(h[3])}</span></a>`).join('') : '<div class="empty">No match</div>';
  results.hidden = false;
});
search.addEventListener('keydown', e => { if (e.key === 'Enter') { const a = results.querySelector('a'); if (a) { location.hash = a.getAttribute('href').slice(1); search.value = ''; results.hidden = true; } } if (e.key === 'Escape') { results.hidden = true; } });
results.addEventListener('click', () => { search.value = ''; results.hidden = true; });
document.addEventListener('click', e => { if (!e.target.closest('.search-wrap')) results.hidden = true; });

$('#theme-btn').addEventListener('click', () => {
  const root = document.documentElement;
  const dark = root.dataset.theme ? root.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  root.dataset.theme = dark ? 'light' : 'dark';
  try { localStorage.setItem('harbormaster-theme', root.dataset.theme); } catch (e) { /* storage unavailable */ }
});

/* live tail */
setInterval(() => {
  const r = parseRoute();
  if (r.view !== 'service' || r.tab !== 'logs') return;
  const s = SERVICES[r.id], L = logsOf(s);
  if (!L.follow || !running(s.id).length) return;
  const l = mkLog(s, Date.now());
  L.lines.push(l);
  if (L.lines.length > 400) L.lines.shift();
  const f = L.filter.toLowerCase();
  if ((L.container === 'all' || l.ct === L.container) && (L.stream === 'all' || l.lvl !== 'info') && (!f || l.msg.toLowerCase().includes(f))) {
    const box = $('#log-box');
    box.insertAdjacentHTML('beforeend', logLine(l));
    box.scrollTop = box.scrollHeight;
  }
}, 1400);

window.addEventListener('hashchange', () => { render(); $('#content').scrollTop = 0; });
renderFilters();
render();
// notifications is mid-rollout from :9 to :10 when the page opens
{
  const s = SERVICES.s4;
  startDeploy(s, 10, null);
  s.deploy.started = NOW - 3 * MIN;
}
</script>
</body>
</html>
