# Local AWS emulator and database for the Harbormaster floci checks. Both ports bind to loopback only.
# No Docker socket is mounted: ECS runs in mock mode, so no task containers are ever started.
name: hm-floci
services:
  floci:
    image: floci/floci:2.4.0
    container_name: hm-floci
    environment:
      FLOCI_SERVICES_ECS_MOCK: "true"
    ports:
      - "127.0.0.1:4566:4566"
    healthcheck:
      # The image has no curl or wget; it ships this bash probe against /_floci/init.
      test: ["CMD", "/usr/local/bin/healthcheck.sh"]
      interval: 3s
      timeout: 5s
      retries: 30
  pg:
    image: postgres:16.4-alpine
    container_name: hm-floci-pg
    environment:
      POSTGRES_PASSWORD: hm # test-only database, bound to loopback
    ports:
      - "127.0.0.1:55433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 30
