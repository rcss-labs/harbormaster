name: CI

on:
  pull_request:
  push:
    branches: [main]

# Read-only token for every job. Fork pull requests get no secrets (pull_request, never pull_request_target).
permissions:
  contents: read

# A new push to a pull request cancels its older run; runs on main always finish.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Required checks: lint, go-test, web-test, tf-check. Branch protection on main names these exact job names.

  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm --prefix web ci
      - run: make lint

  go-test:
    name: go-test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Image tags must match `make test-db` and tools/kv-images.txt; the first step fails if they drift.
    services:
      postgres:
        image: postgres:16.4-alpine
        env:
          POSTGRES_PASSWORD: hm
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
      valkey:
        image: valkey/valkey:7.2.5-alpine
        ports: ["63791:6379"]
      redis:
        image: redis:7.0.15-alpine
        ports: ["63792:6379"]
    env:
      HM_TEST_DATABASE_URL: postgres://postgres:hm@127.0.0.1:5432/postgres?sslmode=disable
      HM_TEST_KV_URLS: redis://127.0.0.1:63791,redis://127.0.0.1:63792
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check service images match the local test pins
        run: |
          set -euo pipefail
          status=0
          for image in $(grep -v '^#' tools/kv-images.txt | awk '{print $3}') postgres:16.4-alpine; do
            if ! grep -q "image: ${image}\$" .github/workflows/ci.yml; then
              echo "::error::${image} is pinned for local tests but is not a service image in .github/workflows/ci.yml"
              status=1
            fi
          done
          if ! grep -q 'postgres:16.4-alpine' Makefile; then
            echo "::error::the Makefile test-db target no longer uses postgres:16.4-alpine; update ci.yml to match"
            status=1
          fi
          exit "$status"
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - run: go test -timeout 30m ./...

  web-test:
    name: web-test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm --prefix web ci
      - run: npm --prefix web test -- --run

  tf-check:
    name: tf-check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false
      - uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2
      - run: make tf-check
